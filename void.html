      uniform sampler2D uTex;uniform float uOpacity;uniform float uFade;
      varying float vGlow;varying float vConn;varying float vHeat;
      void main(){
        vec4 t=texture2D(uTex,gl_PointCoord);if(t.a<.02)discard;
        vec3 c=mix(hueRot(ramp(vHeat),uTint),vec3(1.0),vConn*0.45);
        gl_FragColor=vec4(c*vGlow,t.a*uOpacity*uFade);
      }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  reg(helixMat,'helix');core.add(new THREE.Points(g,helixMat));
}

/* ---- arcs ---- */
const arcGroup=new THREE.Group();core.add(arcGroup);
const arcs=[];let arcsFired=0;
for(let i=0;i<8;i++){
  const SEGS=30,pos=new Float32Array(SEGS*3);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.LineBasicMaterial({color:0x7df0ff,transparent:true,opacity:0,
    blending:THREE.AdditiveBlending,depthWrite:false});
  const line=new THREE.Line(g,m);arcGroup.add(line);
  arcs.push({line,pos,segs:SEGS,life:0,start:new THREE.Vector3(),end:new THREE.Vector3()});
}
let arcSeq=0;
function spawnArc(a){
  // endpoints walk the golden angle, so successive arcs never land on top
  // of each other and never leave a face of the mesh unvisited
  const i=arcSeq++;
  const t1=i*GA,p1=Math.acos(1-2*vdc(i,2));
  const t2=t1+(vdc(i,3)-.5)*2,p2=p1+(vdc(i,5)-.5)*1.5;
  a.start.set(Math.sin(p1)*Math.cos(t1),Math.cos(p1),Math.sin(p1)*Math.sin(t1));
  a.end.set(Math.sin(p2)*Math.cos(t2),Math.cos(p2),Math.sin(p2)*Math.sin(t2));
  a.life=.55+vdc(i,7)*.45;arcsFired++;
}
let arcTimer=0;

/* ---- hex shields ---- */
const hexes=[];
{
  const grp=new THREE.Group();
  const HEXN=52;
  for(let i=0;i<HEXN;i++){
    const size=.08+vdc(i,3)*.06,sh=new THREE.Shape();
    for(let h=0;h<6;h++){
      const a=(Math.PI/3)*h-Math.PI/6,x=Math.cos(a)*size,y=Math.sin(a)*size;
      h===0?sh.moveTo(x,y):sh.lineTo(x,y);
    }
    sh.closePath();
    const geo=new THREE.ShapeGeometry(sh),base=.03+vdc(i,5)*.04;
    const mat=new THREE.MeshBasicMaterial({color:0x3dd8f5,transparent:true,opacity:base,
      side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
    const mesh=new THREE.Mesh(geo,mat);
    // evenly distributed shells rather than a random scatter, so the lattice
    // reads as a built structure
    const yy=1-(i/(HEXN-1))*2, rad=Math.sqrt(Math.max(0,1-yy*yy)), th=GA*i;
    const r=2.34+vdc(i,7)*.2;
    mesh.position.set(Math.cos(th)*rad*r,yy*r,Math.sin(th)*rad*r);
    mesh.lookAt(0,0,0);
    const eBase=.12+vdc(i,11)*.08;
    const edge=new THREE.LineSegments(new THREE.EdgesGeometry(geo),
      new THREE.LineBasicMaterial({color:0x7df0ff,transparent:true,opacity:eBase,
        blending:THREE.AdditiveBlending,depthWrite:false}));
    edge.position.copy(mesh.position);edge.quaternion.copy(mesh.quaternion);
    grp.add(mesh,edge);
    hexes.push({mesh,edge,base,eBase,flash:0,y:mesh.position.y});
  }
  core.add(grp);
}

/* ---- dust ---- */
{
  const D=2400,pos=new Float32Array(D*3),rnd=new Float32Array(D);
  for(let i=0;i<D;i++){
    const y=1-(i/(D-1))*2, rad=Math.sqrt(Math.max(0,1-y*y)), th=GA*i;
    const r=2.9+vdc(i,2)*4.4;
    pos[i*3]=Math.cos(th)*rad*r;pos[i*3+1]=y*r*.7;pos[i*3+2]=Math.sin(th)*rad*r;
    rnd[i]=vdc(i,3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aRand',new THREE.BufferAttribute(rnd,1));
  const m=new THREE.ShaderMaterial({
    uniforms:u({uSize:{value:1.6},uOpacity:{value:.5},uFade:{value:1},uAperture:{value:.018}}),
    vertexShader:FIELD+DOF_EXT+`
      attribute float aRand;uniform float uSize;uniform float uPR;
      varying float vGlow;varying float vHeat;
      void main(){
        vec3 p=position;
        p.y+=sin(uTime*0.3+aRand*30.0)*0.12;
        p.x+=cos(uTime*0.25+aRand*22.0)*0.10;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_Position=projectionMatrix*mv;
        float reveal=scanGlow(p.y)*1.15+uPulse*1.6+uAmp*.55;
        vGlow=0.10+aRand*0.28+reveal;
        vHeat=clamp(uEnergy*0.34+aRand*0.26,0.0,1.0);
        gl_PointSize=(uSize*uPR*(7.0/-mv.z))*dofSize(mv.z);
        vGlow*=dofDim(mv.z);
      }`,
    fragmentShader:FIELD+`
      uniform sampler2D uTex;uniform float uOpacity;uniform float uFade;
      varying float vGlow;varying float vHeat;
      void main(){
        vec4 t=texture2D(uTex,gl_PointCoord);if(t.a<.02)discard;
        gl_FragColor=vec4(hueRot(ramp(vHeat),uTint)*vGlow,t.a*uOpacity*uFade);
      }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  reg(m,'dust');scene.add(new THREE.Points(g,m));
}

/* ---- deep field ----
   Distant stars on a wide shell. They sit outside the core group, so the
   camera's own drift gives them parallax against everything else, and each
   one carries a temperature: cold blue through white to gold and rose. This
   is where most of the colour in the frame comes from at rest. */
const starGroup=new THREE.Group();scene.add(starGroup);
let starMat;
{
  const S=N(2800,1300);
  const pos=new Float32Array(S*3),rnd=new Float32Array(S),tmp=new Float32Array(S);
  // spherical Fibonacci for direction, radical inverse for depth: an even
  // sky at every scale, with no clusters and no bald patches
  for(let i=0;i<S;i++){
    const y=1-(i/(S-1))*2, rad=Math.sqrt(Math.max(0,1-y*y)), th=GA*i;
    const r=15+vdc(i,2)*36;
    pos[i*3]=Math.cos(th)*rad*r;
    pos[i*3+1]=y*r*.85;
    pos[i*3+2]=Math.sin(th)*rad*r;
    rnd[i]=vdc(i,3);tmp[i]=vdc(i,5);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aRand',new THREE.BufferAttribute(rnd,1));
  g.setAttribute('aTemp',new THREE.BufferAttribute(tmp,1));
  starMat=new THREE.ShaderMaterial({
    uniforms:u({uSize:{value:2.5},uOpacity:{value:.95},uFade:{value:1},uStarK:{value:1},
                uAperture:{value:.010},uTex:{value:TEX_HARD}}),
    vertexShader:FIELD+DOF_EXT+`
      attribute float aRand;attribute float aTemp;
      uniform float uSize;uniform float uPR;uniform float uStarK;
      varying float vTw;varying vec3 vCol;
      void main(){
        vec4 mv=modelViewMatrix*vec4(position,1.0);
        gl_Position=projectionMatrix*mv;
        float tw=0.55+0.45*sin(uTime*(0.5+aRand*2.0)+aRand*44.0);
        vTw=tw*(0.30+aRand*0.85)*uStarK*(0.85+uAmp*0.6);
        vec3 cool=vec3(0.42,0.70,1.00), white=vec3(0.92,0.98,1.00),
             warm=vec3(1.00,0.80,0.52), rose=vec3(1.00,0.52,0.78);
        vec3 c=mix(cool,white,smoothstep(0.00,0.44,aTemp));
        c=mix(c,warm,smoothstep(0.56,0.86,aTemp));
        c=mix(c,rose,smoothstep(0.88,1.00,aTemp));
        // the field pulls the whole sky a little way toward the core's hue
        vCol=mix(c,hueRot(c,uTint*0.85+uEnergy*0.30),0.52);
        gl_PointSize=(uSize*uPR*(0.5+aRand*1.6)*tw*(30.0/-mv.z))*dofSize(mv.z);
        vTw*=dofDim(mv.z);
      }`,
    fragmentShader:FIELD+`
      uniform sampler2D uTex;uniform float uOpacity;uniform float uFade;
      varying float vTw;varying vec3 vCol;
      void main(){
        vec4 t=texture2D(uTex,gl_PointCoord);if(t.a<.02)discard;
        gl_FragColor=vec4(vCol*vTw*1.5,t.a*uOpacity*uFade);
      }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  reg(starMat,'stars');starGroup.add(new THREE.Points(g,starMat));
}

/* ---- accretion disk ----
   Keplerian: the inner orbits sweep round far faster than the outer ones,
   which is what makes the shear read as gravity rather than a spinning
   plate. Inner radii run hot, outer radii swing violet, and the limb
   turning toward the camera brightens and blues. */
const diskMats=[],diskLensPts=[];const diskGroup=new THREE.Group();
{
  const D=N(13000,5200);
  const pos=new Float32Array(D*3),ang=new Float32Array(D),rr=new Float32Array(D),
        rnd=new Float32Array(D),thk=new Float32Array(D);
  // golden angle around the disk, radical inverse outward: the same even
  // fill a sunflower uses, which is why it never shows spokes or gaps
  for(let i=0;i<D;i++){
    ang[i]=i*GA;
    rr[i]=1.72+Math.pow(vdc(i,2),1.75)*3.7;         // dense inside, thinning out
    rnd[i]=vdc(i,3);
    thk[i]=(vdc(i,5)*2-1)*Math.pow(vdc(i,7),2);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aAngle',new THREE.BufferAttribute(ang,1));
  g.setAttribute('aR',new THREE.BufferAttribute(rr,1));
  g.setAttribute('aRand',new THREE.BufferAttribute(rnd,1));
  g.setAttribute('aThick',new THREE.BufferAttribute(thk,1));

  /* The same disk is drawn three times. Once as itself, and twice as its own
     lensed images: light leaving the far side, bent over the top of the
     shadow and under the bottom, arriving back in view as arcs that close
     around the hole. The images are built directly in view space — they are
     always circular about the shadow no matter how the disk is tilted, which
     is exactly what lensing does — and they compress toward the photon ring
     rather than keeping the disk's own radii. */
  function diskMaterial(warp,side,opacity){
    const m=new THREE.ShaderMaterial({
      uniforms:u({uSize:{value:2.1},uOpacity:{value:opacity},uFade:{value:1},
                  uDiskK:{value:1},uSpin:{value:1},uWave:{value:0},
                  uWarp:{value:warp},uSide:{value:side},uLensK:{value:1}}),
      vertexShader:FIELD+DOF_EXT+`
        attribute float aAngle;attribute float aR;attribute float aRand;attribute float aThick;
        uniform float uSize;uniform float uPR;uniform float uDiskK;uniform float uSpin;
        uniform float uWave;uniform float uWarp;uniform float uSide;uniform float uLensK;
        varying float vGlow;varying float vHeat;varying float vShift;
        void main(){
          float w=0.95/pow(aR,1.5);                       // Keplerian shear
          float dilation=mix(.34,1.0,smoothstep(1.72,5.42,aR));
          float localTime=uTime*dilation;
          float ang=aAngle+localTime*w*1.05*uSpin;
          float warp=field(vec3(cos(ang),aR*0.35,sin(ang))*1.25,uTime*0.55);
          // a two-armed density wave, fired at random and left to wind itself
          // up by the shear - spiral arms nobody had to draw
          float dw=sin(ang*2.0-uTime*1.1+aR*1.7);
          float r=aR*uDiskK+warp*0.05*aR*0.35+uPulse*0.06+dw*uWave*0.055*aR*0.35;
          float y=aThick*(0.015+aR*0.030)+warp*0.022;
          float inner=clamp(1.0-(aR-1.72)/3.7,0.0,1.0);
          // line-of-sight velocity: +1 coming at you, -1 going away
          float vlos=cos(ang);
          float dop=0.42+0.95*max(vlos,0.0);
          float seam=1.0;

          vec4 mv;
          if(uWarp<0.5){
            mv=modelViewMatrix*vec4(cos(ang)*r,y,sin(ang)*r,1.0);
          }else{
            // the shadow's centre in view space, and an arc drawn about it
            vec4 c=modelViewMatrix*vec4(0.0,0.0,0.0,1.0);
            float rl=1.06+(r-1.72)*0.55;                  // pulled in toward the ring
            float a=ang*0.5*uSide;
            // fades where the arc meets the disk's own plane, so the image
            // hands over to the real disk instead of crossing it
            seam=0.22+0.78*abs(sin(a));
            mv=vec4(c.xyz+vec3(cos(a)*rl,sin(a)*rl*0.84,y*0.4+0.02),1.0);
          }

          gl_Position=projectionMatrix*mv;
          float scan=scanGlow(y*4.0);
          vHeat=clamp(uEnergy*0.42+inner*0.58+uPulse*0.18+max(dw,0.0)*uWave*0.22,0.0,1.0);
          // outer radii swing round the wheel, the near limb swings back
          // the approaching limb swings one way round the wheel and the
          // receding limb the other - the disk gains colour across itself
          // instead of being one hue at two brightnesses
          vShift=(1.0-inner)*1.05-vlos*0.62;
          vGlow=((0.22+inner*0.95)*dop*(0.75+aRand*0.55)+uAmp*0.35+scan*0.25
                +max(dw,0.0)*uWave*0.6);
          if(uWarp>0.5) vGlow*=seam*(0.30+uLensK*0.34);   // images are fainter
          gl_PointSize=(uSize*uPR*(0.6+inner*1.7+uPulse*0.8)*(7.0/-mv.z)
                       *(uWarp>0.5?0.85:1.0))*dofSize(mv.z);
          vGlow*=dofDim(mv.z);
        }`,
      fragmentShader:FIELD+`
        uniform sampler2D uTex;uniform float uOpacity;uniform float uFade;
        varying float vGlow;varying float vHeat;varying float vShift;
        void main(){
          vec4 t=texture2D(uTex,gl_PointCoord);if(t.a<.02)discard;
          gl_FragColor=vec4(hueRot(hueRot(ramp(vHeat),uTint),vShift)*vGlow,t.a*uOpacity*uFade);
        }`,
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
    reg(m,'disk');diskMats.push(m);
    return m;
  }

  diskGroup.add(new THREE.Points(g,diskMaterial(0,0,.8)));
  const lensTop=new THREE.Points(g,diskMaterial(1, 1,.8));
  const lensBot=new THREE.Points(g,diskMaterial(1,-1,.8));
  lensTop.frustumCulled=false;lensBot.frustumCulled=false;
  diskLensPts.push(lensTop,lensBot);
  diskGroup.add(lensTop,lensBot);
  diskGroup.rotation.set(1.09,0,.20);
  core.add(diskGroup);
}

/* ---- infall ----
   Material leaving the disk and spiralling in. Each mote accelerates as it
   falls, heats as it accelerates, and is gone by the time it reaches the
   horizon. Nothing here loops on a timer: it is one continuous stream with
   every mote at a different point in the same fall. */
let infallMat;
{
  const F=N(1600,700);
  const pos=new Float32Array(F*3),seed=new Float32Array(F),ang=new Float32Array(F),
        r0=new Float32Array(F),rnd=new Float32Array(F);
  // phases spread by radical inverse, so the stream is continuous rather
  // than arriving in clumps
  for(let i=0;i<F;i++){
    seed[i]=vdc(i,2);ang[i]=i*GA;
    r0[i]=2.0+vdc(i,3)*3.2;rnd[i]=vdc(i,5);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  g.setAttribute('aAngle',new THREE.BufferAttribute(ang,1));
  g.setAttribute('aR0',new THREE.BufferAttribute(r0,1));
  g.setAttribute('aRand',new THREE.BufferAttribute(rnd,1));
  infallMat=new THREE.ShaderMaterial({
    uniforms:u({uSize:{value:2.4},uOpacity:{value:.85},uFade:{value:1},
                uDiskK:{value:1},uRate:{value:1}}),
    vertexShader:FIELD+DOF_EXT+`
      attribute float aSeed;attribute float aAngle;attribute float aR0;attribute float aRand;
      uniform float uSize;uniform float uPR;uniform float uDiskK;uniform float uRate;
      varying float vGlow;varying float vHeat;varying float vShift;
      void main(){
        float t0=fract(aSeed+uTime*(0.045+aRand*0.055)*uRate);
        float dilation=mix(.42,1.0,smoothstep(.18,1.0,t0));
        float t=fract(aSeed+uTime*(0.045+aRand*0.055)*uRate*dilation);
        float e=t*t*(3.0-2.0*t);                        // ease into the fall
        float r=mix(aR0,0.34,e)*uDiskK;
        float ang=aAngle+(1.0/max(r,0.34))*2.6+uTime*0.35;
        float y=mix((aRand-0.5)*0.55,0.0,e)+sin(uTime*0.8+aRand*30.0)*0.02*(1.0-e);
        vec3 p=vec3(cos(ang)*r,y,sin(ang)*r);
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_Position=projectionMatrix*mv;
        float fade=smoothstep(0.0,0.10,t)*(1.0-smoothstep(0.74,1.0,t));
        vHeat=clamp(uEnergy*0.35+e*0.80+0.10,0.0,1.0);
        vShift=(1.0-e)*0.75;                            // cools violet far out
        vGlow=(0.30+e*1.7)*fade*(0.7+aRand*0.6)+uPulse*0.4;
        gl_PointSize=(uSize*uPR*(0.5+e*2.6)*max(fade,0.0)*(7.0/-mv.z))*dofSize(mv.z);
        vGlow*=dofDim(mv.z);
      }`,
    fragmentShader:FIELD+`
      uniform sampler2D uTex;uniform float uOpacity;uniform float uFade;
      varying float vGlow;varying float vHeat;varying float vShift;
      void main(){
        vec4 t=texture2D(uTex,gl_PointCoord);if(t.a<.02)discard;
        gl_FragColor=vec4(hueRot(hueRot(ramp(vHeat),uTint),vShift)*vGlow,t.a*uOpacity*uFade);
      }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  reg(infallMat,'infall');
  const pts=new THREE.Points(g,infallMat);
  diskGroup.add(pts);
}

/* ---- horizon ----
   A small opaque shadow at the centre. It writes depth, so anything that
   passes behind it is genuinely occluded rather than dimmed — the one solid
   object in a scene made entirely of light. It shrinks as the core heats. */
const horizon=new THREE.Mesh(
  new THREE.SphereGeometry(1,32,24),
  new THREE.MeshBasicMaterial({color:0x000205}));
horizon.scale.setScalar(.27);horizon.renderOrder=-1;core.add(horizon);

/* ---- halo and shockwaves ----
   Billboarded annuli that always face the camera. The halo is the standing
   ring at the horizon; the shockwaves are fired by pulses and expand out
   through the disk. */
function annulus(size){
  const m=new THREE.ShaderMaterial({
    uniforms:u({uR:{value:.5},uW:{value:.05},uOpacity:{value:1},uFade:{value:1},
                uHue:{value:0},uBright:{value:2.0}}),
    vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:FIELD+`
      varying vec2 vUv;
      uniform float uR;uniform float uW;uniform float uOpacity;uniform float uFade;
      uniform float uHue;uniform float uBright;
      void main(){
        vec2 d=vUv-0.5;
        float r=length(d)*2.0;
        float a=exp(-pow((r-uR)/max(uW,0.001),2.0));
        float ang=atan(d.y,d.x);
        a*=0.72+0.28*sin(ang*3.0+uTime*1.7);            // slow rotation in the rim
        vec3 c=hueRot(ramp(clamp(uEnergy*0.95+0.22,0.0,1.0)),uHue+uTint);
        gl_FragColor=vec4(c*a*uBright,a*uOpacity*uFade);
      }`,
    transparent:true,depthWrite:false,depthTest:false,blending:THREE.AdditiveBlending});
  reg(m,'halo');
  const mesh=new THREE.Mesh(new THREE.PlaneGeometry(size,size),m);
  scene.add(mesh);
  return mesh;
}
const halo=annulus(3.4);
halo.material.uniforms.uR.value=.62;
halo.material.uniforms.uW.value=.028;
halo.material.uniforms.uBright.value=2.6;

const waves=[];
for(let i=0;i<4;i++){
  const m=annulus(13);
  m.material.uniforms.uOpacity.value=0;
  waves.push({mesh:m,life:0});
}
function fireWave(power,inward){
  const w=waves.find(w=>w.life<=0)||waves[0];
  w.life=1;
  w.mesh.material.uniforms.uHue.value=(gr()-.5)*.9;
  w.power=power;w.inward=!!inward;
}

/* ---- gimbal ----
   Three thin rings on skewed axes, each carrying a bright point that runs
   round it. They read as the instrument the core is mounted in: structure
   around the energy rather than more energy. */
const gimbal=new THREE.Group();core.add(gimbal);
const gimbalMats=[];
const RING_LINE_V=FIELD+`
  uniform float uPhase;uniform float uSpeed;
  varying float vG;varying float vH;
  void main(){
    vec3 p=position;
    vec4 mv=modelViewMatrix*vec4(p,1.0);
    gl_Position=projectionMatrix*mv;
    float a=atan(p.z,p.x);
    float sweep=fract(a/6.2831853-uTime*uSpeed+uPhase);
    float head=pow(sweep,7.0)*2.2+pow(fract(sweep+0.5),16.0)*0.9;
    float scan=scanGlow(p.y);
    vG=0.09+head+uAmp*0.28+scan*0.5+uPulse*0.3;
    vH=clamp(uEnergy*0.62+head*0.22+scan*0.2,0.0,1.0);
  }`;
const RING_LINE_F=FIELD+`
  uniform float uOpacity;uniform float uFade;
  varying float vG;varying float vH;
  void main(){
    gl_FragColor=vec4(hueRot(ramp(vH),uTint)*vG,uOpacity*uFade*clamp(vG,0.0,1.2));
  }`;
function gimbalRing(radius,speed,phase,opacity){
  const seg=200,pts=[];
  for(let i=0;i<=seg;i++){
    const a=i/seg*Math.PI*2;
    pts.push(new THREE.Vector3(Math.cos(a)*radius,0,Math.sin(a)*radius));
  }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  const m=new THREE.ShaderMaterial({
    uniforms:u({uOpacity:{value:opacity},uFade:{value:1},uPhase:{value:phase},uSpeed:{value:speed}}),
    vertexShader:RING_LINE_V,fragmentShader:RING_LINE_F,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  reg(m,'gimbal');gimbalMats.push(m);
  const line=new THREE.Line(g,m);
  gimbal.add(line);return line;
}
const g1=gimbalRing(2.72,.11,0,.55),
      g2=gimbalRing(3.05,-.07,.33,.42),
      g3=gimbalRing(3.38,.05,.66,.32);
g1.rotation.set(.30,0,.42);g2.rotation.set(-1.15,0,.18);g3.rotation.set(.95,0,-.55);

/* ---- dial ----
   A graduated ring in the disk plane, every eighth division long. It turns
   slowly and reads like a bearing scale: the one part of the core that is
   openly an instrument. */
let dialMat;const dialGroup=new THREE.Group();core.add(dialGroup);
{
  const TICKS=120,pts=[];
  for(let i=0;i<TICKS;i++){
    const a=i/TICKS*Math.PI*2, long=(i%8===0), len=long?.17:.075;
    const r0=3.62, r1=r0+len;
    pts.push(new THREE.Vector3(Math.cos(a)*r0,0,Math.sin(a)*r0));
    pts.push(new THREE.Vector3(Math.cos(a)*r1,0,Math.sin(a)*r1));
  }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  dialMat=new THREE.ShaderMaterial({
    uniforms:u({uOpacity:{value:.5},uFade:{value:1},uPhase:{value:0},uSpeed:{value:.03}}),
    vertexShader:RING_LINE_V,fragmentShader:RING_LINE_F,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  reg(dialMat,'dial');
  dialGroup.add(new THREE.LineSegments(g,dialMat));
  dialGroup.rotation.set(1.09,0,.20);
}

/* ---- geometric ornaments removed; only the original shield cells remain ---- */
const plates=[];

/* ---- jets ----
   Along the spin axis, and only when the core is genuinely driven: shell
   commands, parallel work, faults. Everything else in the scene is round, so
   two hard columns leaving the poles change the silhouette completely. */
let jetMat;
{
  const JN=N(1400,600);
  const pos=new Float32Array(JN*3),aT=new Float32Array(JN),
        rnd=new Float32Array(JN),side=new Float32Array(JN);
  for(let i=0;i<JN;i++){
    aT[i]=vdc(i,2);rnd[i]=vdc(i,3);side[i]=(i%2)?1:-1;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aT',new THREE.BufferAttribute(aT,1));
  g.setAttribute('aRand',new THREE.BufferAttribute(rnd,1));
  g.setAttribute('aSide',new THREE.BufferAttribute(side,1));
  jetMat=new THREE.ShaderMaterial({
    uniforms:u({uSize:{value:2.3},uOpacity:{value:.9},uFade:{value:1},uJet:{value:0}}),
    vertexShader:FIELD+DOF_EXT+`
      attribute float aT;attribute float aRand;attribute float aSide;
      uniform float uSize;uniform float uPR;uniform float uJet;
      varying float vGlow;varying float vHeat;
      void main(){
        float t=fract(aT+uTime*(0.30+aRand*0.30));
        float y=aSide*(0.18+t*4.6);
        float r=(0.045+t*0.62)*(0.5+aRand*0.9);
        float a=aRand*6.2831853+uTime*2.2*aSide;
        vec3 p=vec3(cos(a)*r,y,sin(a)*r);
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_Position=projectionMatrix*mv;
        float fade=uJet*smoothstep(0.0,0.07,t)*(1.0-smoothstep(0.55,1.0,t));
        vGlow=(0.5+(1.0-t)*2.0)*fade;
        vHeat=clamp(uEnergy*0.45+(1.0-t)*0.55,0.0,1.0);
        gl_PointSize=(uSize*uPR*(0.5+(1.0-t)*1.8)*max(fade,0.0)*(7.0/-mv.z))*dofSize(mv.z);
        vGlow*=dofDim(mv.z);
      }`,
    fragmentShader:FIELD+`
      uniform sampler2D uTex;uniform float uOpacity;uniform float uFade;
      varying float vGlow;varying float vHeat;
      void main(){
        vec4 t=texture2D(uTex,gl_PointCoord);if(t.a<.02)discard;
        vec3 c=mix(hueRot(ramp(vHeat),uTint),vec3(1.0),0.2);
        gl_FragColor=vec4(c*vGlow,t.a*uOpacity*uFade);
      }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  reg(jetMat,'jets');core.add(new THREE.Points(g,jetMat));
}

/* ---- motes ----
   Single grains, spawned one at a time by things that actually happen: a
   run of tokens arriving, a line of the log being taken. Each one falls
   from wherever it was born, spirals in and heats as it goes. This is the
   join between the interface and the scene — text on the left of the screen
   becomes matter that the core visibly swallows. */
const MOTE_N=N(360,180);
let moteMat,moteGeo,moteIdx=0,motePos,moteBirth,simTime=0;
{
  motePos=new Float32Array(MOTE_N*3);
  moteBirth=new Float32Array(MOTE_N).fill(-999);
  const seed=new Float32Array(MOTE_N);
  for(let i=0;i<MOTE_N;i++)seed[i]=vdc(i+1,2);
  moteGeo=new THREE.BufferGeometry();
  moteGeo.setAttribute('position',new THREE.BufferAttribute(motePos,3));
  moteGeo.setAttribute('aBirth',new THREE.BufferAttribute(moteBirth,1));
  moteGeo.setAttribute('aSeed',new THREE.BufferAttribute(seed,1));
  moteMat=new THREE.ShaderMaterial({
    uniforms:u({uSize:{value:3.4},uOpacity:{value:1},uFade:{value:1},uLife:{value:2.7},
                uCenter:{value:new THREE.Vector3()}}),
    vertexShader:FIELD+DOF_EXT+`
      attribute float aBirth;attribute float aSeed;
      uniform float uSize;uniform float uPR;uniform float uLife;uniform vec3 uCenter;
      varying float vGlow;varying float vHeat;
      void main(){
        float age=(uTime-aBirth)/uLife;
        if(age<0.0||age>1.0){
          gl_Position=vec4(2.0,2.0,2.0,1.0);gl_PointSize=0.0;vGlow=0.0;vHeat=0.0;return;
        }
        float e=age*age*(3.0-2.0*age);
        vec3 st=position-uCenter;
        float r0=length(st.xz);
        float a=atan(st.z,st.x)+e*3.6+aSeed*0.5;
        float r=mix(r0,0.30,e*e);
        float y=mix(st.y,0.0,e);
        vec3 p=vec3(cos(a)*r,y,sin(a)*r)+uCenter;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_Position=projectionMatrix*mv;
        float fade=smoothstep(0.0,0.06,age)*(1.0-smoothstep(0.76,1.0,age));
        vGlow=(0.55+e*2.5)*fade;
        vHeat=clamp(uEnergy*0.30+e*0.75+0.12,0.0,1.0);
        gl_PointSize=(uSize*uPR*(0.55+e*1.9)*fade*(7.0/-mv.z))*dofSize(mv.z);
        vGlow*=dofDim(mv.z);
      }`,
    fragmentShader:FIELD+`
      uniform sampler2D uTex;uniform float uOpacity;uniform float uFade;
      varying float vGlow;varying float vHeat;
      void main(){
        vec4 t=texture2D(uTex,gl_PointCoord);if(t.a<.02)discard;
        vec3 c=mix(hueRot(ramp(vHeat),uTint),vec3(1.0),0.18);
        gl_FragColor=vec4(c*vGlow,t.a*uOpacity*uFade);
      }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  reg(moteMat,'motes');
  const mpts=new THREE.Points(moteGeo,moteMat);
  mpts.frustumCulled=false;
  scene.add(mpts);
}
function spawnMote(x,y,z){
  moteIdx=(moteIdx+1)%MOTE_N;
  motePos[moteIdx*3]=x;motePos[moteIdx*3+1]=y;motePos[moteIdx*3+2]=z;
  moteBirth[moteIdx]=simTime;
  moteGeo.attributes.position.needsUpdate=true;
  moteGeo.attributes.aBirth.needsUpdate=true;
}
// a token's worth of matter, entering from the disk
let moteSeq=0;
function spawnTokenMote(){
  const i=moteSeq++;
  const r=2.4+vdc(i,2)*1.5, a=i*GA;
  spawnMote(Math.cos(a)*r,(vdc(i,3)-.5)*.5,Math.sin(a)*r);
}
// and a point on the screen turned into a point in the scene
const _sw=new THREE.Vector3();
function screenToWorld(px,py){
  _sw.set(px/W()*2-1,-(py/H()*2-1),.5).unproject(camera);
  _sw.sub(camera.position).normalize();
  const t=Math.abs(_sw.z)<1e-4?0:-camera.position.z/_sw.z;
  return [camera.position.x+_sw.x*t,camera.position.y+_sw.y*t,0];
}

/* ---- lattice ----
   A ruled plane under the core. It is the one flat, orthogonal thing in a
   scene of curves, which is exactly why it works: states that are about
   structure — listing, planning, searching — stand on it, and the rest have
   no ground at all. It fades with distance and lights where the scan plane
   crosses it. */
let gridMat;
{
  const EXT=11,STEP=.62,pts=[];
  for(let i=-EXT;i<=EXT;i++){
    const u=i*STEP;
    pts.push(new THREE.Vector3(u,0,-EXT*STEP),new THREE.Vector3(u,0,EXT*STEP));
    pts.push(new THREE.Vector3(-EXT*STEP,0,u),new THREE.Vector3(EXT*STEP,0,u));
  }
  const g=new THREE.BufferGeometry().setFromPoints(pts);
  gridMat=new THREE.ShaderMaterial({
    uniforms:u({uOpacity:{value:.5},uFade:{value:1},uGrid:{value:0},uAperture:{value:.03}}),
    vertexShader:FIELD+`
      uniform float uGrid;
      varying float vG;varying float vH;varying float vD;
      void main(){
        vec3 p=position;
        float d=length(p.xz);
        // the plane ripples very slightly, so it reads as a field rather
        // than a decal
        p.y+=sin(d*1.5-uTime*0.9)*0.035*uGrid+field(p*0.4,uTime*0.3)*0.05;
        p.y-=2.15;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_Position=projectionMatrix*mv;
        float scan=scanGlow(p.y+d*0.12);
        vD=1.0-smoothstep(1.5,EXT_F,d);
        vG=(0.10+scan*0.9+uAmp*0.2+uPulse*0.3)*vD*uGrid;
        vH=clamp(uEnergy*0.5+scan*0.3,0.0,1.0);
      }`.replace('EXT_F',(EXT*STEP).toFixed(1)),
    fragmentShader:FIELD+`
      uniform float uOpacity;uniform float uFade;
      varying float vG;varying float vH;varying float vD;
      void main(){
        gl_FragColor=vec4(hueRot(ramp(vH),uTint)*vG,uOpacity*uFade*clamp(vG,0.0,1.0));
      }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  reg(gridMat,'grid');
  core.add(new THREE.LineSegments(g,gridMat));
}

/* ---- ripples ----
   Concentric rings running outward through the disk plane on the beat. Where
   the shockwaves are events, these are a rhythm: the states that hold rather
   than act use them to stay alive without appearing to do anything. */
let rippleMat;
{
  const RINGS=7,PER=N(260,140),RN=RINGS*PER;
  const pos=new Float32Array(RN*3),ring=new Float32Array(RN),ang=new Float32Array(RN),rnd=new Float32Array(RN);
  for(let i=0;i<RN;i++){
    ring[i]=Math.floor(i/PER)/RINGS;
    ang[i]=(i%PER)/PER*Math.PI*2;
    rnd[i]=vdc(i+1,3);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aRing',new THREE.BufferAttribute(ring,1));
  g.setAttribute('aAngle',new THREE.BufferAttribute(ang,1));
  g.setAttribute('aRand',new THREE.BufferAttribute(rnd,1));
  rippleMat=new THREE.ShaderMaterial({
    uniforms:u({uSize:{value:2.0},uOpacity:{value:.85},uFade:{value:1},uRipple:{value:0}}),
    vertexShader:FIELD+DOF_EXT+`
      attribute float aRing;attribute float aAngle;attribute float aRand;
      uniform float uSize;uniform float uPR;uniform float uRipple;
      varying float vGlow;varying float vHeat;
      void main(){
        float t=fract(aRing+uTime*0.14);
        float r=0.55+t*4.4;
        float y=sin(t*3.1416)*0.10*(aRand-0.5)*2.0;
        vec3 p=vec3(cos(aAngle)*r,y,sin(aAngle)*r);
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_Position=projectionMatrix*mv;
        float env=sin(t*3.1416);
        vGlow=(0.25+env*1.5)*uRipple*(0.7+aRand*0.5);
        vHeat=clamp(uEnergy*0.45+(1.0-t)*0.4,0.0,1.0);
        gl_PointSize=(uSize*uPR*(0.5+env*1.4)*(7.0/-mv.z))*dofSize(mv.z);
        vGlow*=dofDim(mv.z);
      }`,
    fragmentShader:FIELD+`
      uniform sampler2D uTex;uniform float uOpacity;uniform float uFade;
      varying float vGlow;varying float vHeat;
      void main(){
        vec4 t=texture2D(uTex,gl_PointCoord);if(t.a<.02)discard;
        gl_FragColor=vec4(hueRot(ramp(vHeat),uTint)*vGlow,t.a*uOpacity*uFade);
      }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  reg(rippleMat,'ripple');
  const rp=new THREE.Points(g,rippleMat);
  diskGroup.add(rp);
}

let pulseV=0,amp=0,ampT=0;
function pulse(v){

  if(v>=.9)CINE.shot({roll:(Math.random()-.5)*.05,dolly:-.30,
                      yaw:(Math.random()-.5)*.05,hold:.22,decay:1.0});

/* ==============================================================
   TELEMETRY — every reading comes from the agent runtime itself.
   THROUGHPUT = tokens/sec   CONTEXT = window used   ACTIVITY = tool load
   ============================================================== */
const $=id=>document.getElementById(id);
const sCalls=$('s-calls'),sCtx=$('s-ctx'),sLens=$('s-lens');
let lastCalls=-1;
let energy=0;
const T={out:0,int:0,load:0};
// live values written by the bridge
const LIVE={tps:0, ctxUsed:0, ctxMax:0, busy:false, tools:0,
            calls:[], toolCalls:0, cost:0, state:'idle'};
function callRate(){
  // tool calls per second over the last 20s — how hard the task is working
  const now=performance.now();
  while(LIVE.calls.length && now-LIVE.calls[0]>20000) LIVE.calls.shift();
  return LIVE.calls.length/20;
}
function computeTelemetry(dt){
  // throughput: tokens/sec, ~60 t/s reads as full scale
  T.out =Math.max(0,Math.min(100, (LIVE.tps/60)*100));
  // context pressure: how full the model's window is
  T.int =Math.max(0,Math.min(100, LIVE.ctxMax? (LIVE.ctxUsed/LIVE.ctxMax)*100 : 0));
  // activity: concurrent tools plus recent call rate plus whether a turn is live
  T.load=Math.max(0,Math.min(100, 100*(
          Math.min(1,LIVE.tools/3)*0.42 +
          Math.min(1,callRate()/0.6)*0.34 +
          (LIVE.busy?0.20:0) + amp*0.08)));
  // energy: what the whole interface is coloured by. The live metrics
  // push it up, but a state's own heat acts as a floor rather than an
  // ingredient — so `overload` reads red whether or not the numbers agree,
  // and a demo of it looks exactly like the real thing.
  const live=(T.load/100)*0.42 + (T.int/100)*0.24 + (T.out/100)*0.18
           + (LIVE.busy?0.10:0);
  const e=Math.max(live+P.heat*0.22, P.heat*0.96);
  energy=damp(energy,Math.max(0,Math.min(1,e)),3,dt||.016);
}
let accentTick=0;
const peaks={out:0,int:0,load:0};

/* Temperature comes from the ramp, identity comes from the state's hue
   rotation. Every colour in the interface — telemetry, log marks, arcs,
   shields, the wordmark mesh, the nebula — goes through here, so the whole
   room changes character together when the state does. */
function tintRGB(x,extra){
  return hueRotJS(rampJS(Math.max(0,Math.min(1,x))),P.tint+(extra||0));
}
const cssRGB=(c,a)=>a===undefined
  ?`rgb(${(c[0]*255)|0},${(c[1]*255)|0},${(c[2]*255)|0})`
  :`rgba(${(c[0]*255)|0},${(c[1]*255)|0},${(c[2]*255)|0},${a})`;
function rgbOf(x){return cssRGB(tintRGB(x))}
function rgbaOf(x,a){return cssRGB(tintRGB(x),a)}

/* Readouts settle the way everything else in the scene settles: the shown
   value is damped toward the true one, so a number arrives rather than
   appears. On a state change they scramble briefly and resolve — the same
   break-and-reform gesture as the wordmark, in a different medium. */
const shown={out:0,int:0,load:0};
const flow={out:0,int:0,load:0};
let scrambleT=0;
const SCRAM='0123456789';
function scrambleText(txt,k){
  let o='';
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    o+=(c>='0'&&c<='9'&&gr()<k)?SCRAM[(gr()*10)|0]:c;
  }
  return o;
}

/* A short history behind each row, drawn on its own strip. The scene keeps
   trails; the readouts keep the same idea at the scale of a number. */
const SPARK_N=64;
const sparks={
  out :{el:$('sp-out'), ctx:null,buf:new Float32Array(SPARK_N),i:0},
  int :{el:$('sp-int'), ctx:null,buf:new Float32Array(SPARK_N),i:0},
  load:{el:$('sp-load'),ctx:null,buf:new Float32Array(SPARK_N),i:0}
};
function sizeSparks(){
  for(const k in sparks){
    const sp=sparks[k];if(!sp.el)continue;
    const w=sp.el.clientWidth||140,h=13;
    sp.el.width=Math.round(w*PR);sp.el.height=Math.round(h*PR);
    sp.ctx=sp.el.getContext('2d');
    sp.ctx.setTransform(PR,0,0,PR,0,0);
    sp.w=w;sp.h=h;
  }
}
function drawSpark(sp,val,col,ghost){
  if(!sp.ctx)return;
  sp.buf[sp.i]=val;sp.i=(sp.i+1)%SPARK_N;
  const c=sp.ctx,w=sp.w,h=sp.h;
  c.clearRect(0,0,w,h);
  c.beginPath();
  for(let j=0;j<SPARK_N;j++){
    const v=sp.buf[(sp.i+j)%SPARK_N]/100;
    const x=j/(SPARK_N-1)*w, y=h-1-v*(h-2);
    j?c.lineTo(x,y):c.moveTo(x,y);
  }
  c.strokeStyle=ghost;c.lineWidth=1;c.stroke();
  // the leading edge is lit, the history behind it is not
  c.lineTo(w,h);c.lineTo(0,h);c.closePath();
  c.fillStyle=ghost;c.globalAlpha=.22;c.fill();c.globalAlpha=1;
  const last=sp.buf[(sp.i+SPARK_N-1)%SPARK_N]/100;
  c.fillStyle=col;
  c.fillRect(w-1.5,h-1-last*(h-2)-1,2.5,2.5);
}

function paintHUD(){
  const e=Math.min(1,energy*1.15);
  const rs=document.documentElement.style;
  rs.setProperty('--accent',rgbOf(e));
  rs.setProperty('--accent-mid',rgbaOf(e,.5));
  rs.setProperty('--accent-dim',rgbaOf(e,.3));
  rs.setProperty('--accent-ghost',rgbaOf(e,.12));
  // the companion hue sits a state-defined distance from the primary, so
  // wide-open states read as broad palettes and hot ones as narrow ones
  const c2=tintRGB(e,P.spread);
  rs.setProperty('--accent2',cssRGB(c2));
  rs.setProperty('--accent2-mid',cssRGB(c2,.42));
  rs.setProperty('--accent2-ghost',cssRGB(c2,.10+e*.06));
  // the room itself takes the colour, one beat behind the core
  rs.setProperty('--wash-a',rgbaOf(e,.055+e*.085));
  rs.setProperty('--wash-b',rgbaOf(e,.018+e*.04));

  // Each metric still carries its own reading, but every hue is pulled
  // partway toward the global energy so the three never fall out of the
  // interface's palette. All three read "more is hotter": faster
  // throughput, fuller context, busier tool activity.
  if(sCalls){
    const c=LIVE.toolCalls|0;
    if(sCalls.textContent!=String(c)){
      sCalls.textContent=c;
      if(lastCalls>=0&&c>lastCalls)spawnTokenMote();   // the count has mass
      lastCalls=c;
    }
    const kb=LIVE.ctxUsed>=1000?(LIVE.ctxUsed/1000).toFixed(1)+'k':String(LIVE.ctxUsed|0);
    if(sCtx.textContent!==kb)sCtx.textContent=kb;
    sLens.textContent=P.lens.toFixed(2);
  }
  const rows0=[
    ['out', T.out,  T.out/100],
    ['int', T.int,  T.int/100],
    ['load',T.load, T.load/100]
  ];
  // during the title sequence the readouts run their full travel first, so
  // you can see the range before you see the reading
  if(bootPhase>0){
    for(let i=0;i<3;i++){
      const v=Math.min(100,bootPhase*100*(1+i*.12));
      rows0[i][1]=v;rows0[i][2]=v/100;
    }
  }
  // the activity label reports what the agent is doing right now
  const kl=$('k-load');
  if(kl){
    const s=LIVE.tools>1 ? LIVE.tools+' tasks'
          : LIVE.tools===1 ? (LIVE.state||'working')
          : LIVE.busy ? 'thinking'
          : ATTACHED ? 'idle' : 'offline';
    if(kl.textContent!==s) kl.textContent=s;
  }
  for(const[id,val,own]of rows0){
    const heat=own*0.55+e*0.45;
    const col=rgbOf(heat);
    const v=$('v-'+id), b=$('b-'+id), p=$('p-'+id);

    // the number is damped toward its true value rather than snapped to it
    shown[id]=damp(shown[id],val,5.5,.09);
    let txt;
    if(id==='out')      txt=String(Math.round(shown[id]*0.6));   // back to tok/s
    else if(id==='int') txt=shown[id].toFixed(1);
    else                txt=String(Math.round(shown[id]));
    if(scrambleT>0)txt=scrambleText(txt,Math.min(1,scrambleT*2.4));
    v.textContent=txt;
    v.dataset.v=txt;                       // feeds the chromatic ghost layers
    v.style.color=col;
    v.style.textShadow='0 0 '+(6+heat*16).toFixed(0)+'px '+rgbaOf(heat,.35);

    b.style.width=val+'%';
    b.style.color=col;
    b.style.boxShadow='0 0 '+(4+heat*10).toFixed(0)+'px '+rgbaOf(heat,.5);
    // the fill flows at the rate of the thing it measures
    flow[id]=(flow[id]+(0.4+own*7.5)*0.09)%4;
    b.style.backgroundPosition=(-flow[id]).toFixed(2)+'px 0';

    drawSpark(sparks[id],val,col,rgbaOf(heat,.42));

    // context only ever climbs within a session, so its mark is a high
    // water line; throughput and activity decay back toward the live value
    if(id==='int') peaks[id]=Math.max(val,peaks[id]);
    else           peaks[id]=Math.max(val,peaks[id]-0.45);
    p.style.left=peaks[id]+'%';
    p.style.background=col;
    p.style.boxShadow='0 0 5px '+col;
  }
  scrambleT=Math.max(0,scrambleT-.09);
  if(booted)paintLogScan();
  // quiet enough to be listening rather than working
  document.body.classList.toggle('quiet',!LIVE.busy&&energy<.10&&LIVE.tools===0);
  document.body.classList.toggle('working',energy>.55);
}

/* ==============================================================
   ROUTINES/* ==============================================================
   ROUTINES
   Each state is a palette and a posture.

   `heat` sets where on the ramp the state sits — the spine runs cold
   blue through cyan, green and gold into orange and red, so hotter
   states are literally hotter. `tint` then rotates that colour round
   the wheel to give the state its own identity, and `spread` sets how
   far the companion hue sits from it. Between them, no two states
   look alike, but every one of them is a rotation of the same ramp,
   so the whole set still reads as one machine.

   `enter` sets where the sim is heading; `hold` keeps shaping it for
   as long as the state lasts, on frequencies from the harmonic ladder
   so nothing beats against anything else.
   ============================================================== */

// entry values are nudged by the golden-ratio sequence, except the ones
// that carry the state's identity — those stay exact
const FIXED={tint:1,heat:1,spread:1,shift:1};
const SKIP={show:1,emph:1,gesture:1};
function state(base,hold,extra){
  return {
    palette:base,
    enter(){
      for(const k in base){ if(SKIP[k])continue; PT[k]=FIXED[k]?base[k]:J(base[k],.06) }
      if(base.show)compose(base.show,base.emph);
      if(base.gesture)gesture(base.gesture);
      if(extra)extra();
    },
    hold
  };
}

const toolLabel=n=>TOOL_LABEL[n]||String(n||'work').replace(/[_-]+/g,' ');

/* A state has to be allowed to be itself for a moment before the next one
   takes over, or a burst of quick tool calls just strobes. Requests that
   arrive too early are queued rather than dropped, so nothing is lost —
   it just lands a beat later. */
const MIN_DWELL=.5;
let pendingMode=null;
let demoLock=false, demoT=0, demoQueue=[];

function startMode(name){
  if(!MODES[name])return;
  if(mode!=='idle')resetTargets();
  mode=name;modeT=0;pendingMode=null;
  // a state change is a change of subject, so the camera takes a new angle
  {let h=0;for(let i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))%997;
   const s1=(h%2?1:-1),a=.055+((h>>2)%7)*.011;
   CINE.shot({yaw:s1*a,pitch:((h>>5)%5-2)*.011,roll:s1*.012,
              dolly:(mode==='think'||mode==='ingest')?-.14:.10,
              hold:1.1,decay:2.2});}
  recent.push(name);if(recent.length>4)recent.shift();
  MODES[name].enter();
}
function requestMode(name){
  if(!MODES[name]||demoLock)return;
  if(name===mode&&modeT<2.5)return;               // already there, let it run
  if(mode!=='idle'&&modeT<MIN_DWELL){pendingMode=name;return}
  startMode(name);
}
function endMode(){
  if(demoLock)return;
  mode='idle';modeT=0;pendingMode=null;resetTargets();
  idleFor=0;nextIn=5+gr()*7;
}
function pickMode(pool){
  // used by the demo cycler and by the detached idle loop
  const keys=(pool||MODE_KEYS.filter(k=>k!=='flare'&&k!=='collapse'&&k!=='nova')).map(k=>{
    let w=1;
    if(recent.includes(k))w*=0.20;
    if(recent[recent.length-1]===k)w*=0.05;
    if(energy>0.6)w*=(k==='disperse'||k==='stream'||k==='sweep'||k==='drift')?2.2:0.35;
    return {k,w};
  });
  const total=keys.reduce((s,p)=>s+p.w,0);
  let r=gr()*total;
  for(const p of keys){r-=p.w;if(r<=0)return p.k}
  return keys[0].k;
}

/* Arrival gestures. A state does not merely retarget its parameters — it
   makes a move on the seam. Six of them, each matched to what the state is
   about to do, so the transition itself carries meaning rather than being a
   crossfade between two arrangements. */
function gesture(kind){
  switch(kind){
    case 'burst':   fireWave(1.15);fireWave(.6);pulse(.75);break;
    case 'implode': fireWave(1.2,true);pulse(.5);
                    PT.cloudR*=1.22;PT.shellR*=1.18;break;   // snaps back in
    case 'flash':   surge=Math.max(surge,1.15);pulse(1.0);beatFlash=1;break;
    case 'shear':   scanDir=-scanDir;PT.scanSpd*=2.4;diskWave=1;break;
    case 'iris':    PT.haloR*=1.7;PT.hexOp*=1.5;fireWave(.5,true);break;
    case 'bloom':   diskWave=.7;PT.bloom*=1.10;beatFlash=1;break;
  }
}

/* ---- the metronome ----
   Unscheduled events used to fire on random timers, which is what made
   them read as noise. Now everything lands on a beat: one period of the
   harmonic ladder, subdivided sixteen ways. A density wave every bar, a
   shockwave on the four when there is enough energy to justify one, an
   arc volley on the six. Same events, but they arrive on a grid, so they
   feel like the core is keeping time rather than twitching. */
let diskWave=0, hexBurst=0, scanDir=1, lastBeat=-1, beatFlash=0, surge=0;
function arcVolley(n){
  for(let i=0;i<n;i++){const a=arcs.find(a=>a.life<=0);if(a)spawnArc(a)}
}
function onBeat(n){
  const q=n%16;
  beatFlash=(q%4===0)?1:.45;                              // downbeats land harder
  // on the bar line, a working core throws a surge of light — the one thing
  // that makes it brighter than its own steady state
  if(q===0&&energy>.30) surge=Math.max(surge,.45+energy*.85);
  else if(q===8&&energy>.55) surge=Math.max(surge,.35+energy*.5);
  if(q===0)      diskWave=1;                              // arms wind up
  else if(q===4) { if(energy>.42)fireWave(.4+energy*.5) }
  else if(q===6) arcVolley(1+(n%3));
  else if(q===9) hexBurst=.8;
  else if(q===10)diskWave=.5;
  else if(q===13){ if(energy>.62)fireWave(.3) }
  else if(q===14)scanDir=-scanDir;
}

/* ==============================================================
   WORDMARK + STATE READOUT
   `VOID` is sampled from real letterforms into a grid of nodes and
   triangulated against their neighbours, then drawn as a mesh in
   whatever colour the core is currently running — the mark is made of
   the same material as everything else on screen rather than sitting
   on top of it.

   The nodes are sprung to their home positions, so on a state change
   the word does not fade back into place: it is thrown outward along
   a field sample, tears along its own edges, then snaps home with a
   little overshoot. Satellites orbit the whole thing and link to
   whichever nodes they pass, so the word is never quite finished.

   Below it, the rule fills with the core's energy, the state is named,
   and every state the machine has gets a tick.
   ============================================================== */
const markEl=$('mark'), markCv=$('markcanvas'), markMeter=$('markmeter');
const markRule=markMeter&&markMeter.parentNode;
const stateNameEl=$('statename'), stateDots=$('statedots');
const mctx=markCv.getContext('2d');
const MARK_GLYPHS=[{c:'V'},{c:'O'},{c:'I'},{c:'D'}];
/* Four letters, one weight, one size — the name is the thing the whole scene
   is about, so it is set plainly and left alone. What keeps it alive is the
   mesh: free satellite nodes that belong to no letter, orbiting the word on
   their own rungs of the ladder and reaching out to whichever nodes they pass
   near. The word is not a closed object — it is something the scene is still
   working on. */
const mkSats=[

  {a:4.3,  rx:.52,ry:1.42,sp:HR[2]*.19,ph:3.4}

/* The scene is made of soft additive sprites; the mark was made of hard

const dabSrc=document.createElement('canvas');dabSrc.width=dabSrc.height=32;
{
  const c=dabSrc.getContext('2d');

  c.clearRect(0,0,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)');

const dabA=document.createElement('canvas'),dabB=document.createElement('canvas');

/* Sampling a run of type into a mesh is useful twice — once for the corner
   mark and once, much larger, for the loading screen — so it is written once
   and parameterised. Returns the nodes, the triangulation between them, and
   the metrics needed to place and light it. */
function sampleGlyphMesh(glyphs,fs,cfg){
  cfg=cfg||{};
  const fsHi=fs*(cfg.capScale||.81);
  // Michroma is wide already, but the O needs room for its ring to run
  const track=cfg.track===undefined?.21:cfg.track;
  const pad=Math.ceil(fs*.55), bleed=Math.round(fs*(cfg.bleed||2.0));
  const font=sz=>(cfg.weight||400)+' '+sz+"px Michroma,'Chakra Petch',monospace";
  const off=document.createElement('canvas'), octx=off.getContext('2d');

  // laid out glyph by glyph so the tracking is ours rather than the browser's
  const items=[];let x=pad+bleed;const baseline=Math.round(fs*1.20)+bleed;
  for(const m of glyphs){
    const sz=m.hi?fsHi:fs;
    octx.font=font(sz);
    if(m.gap)x+=fs*m.gap;                 // optical air where the case changes
    const gw=octx.measureText(m.c).width;
    items.push({c:m.c,sz,x,y:baseline,w:gw});
    x+=gw+sz*track;
  }
  const x0=pad+bleed, tw=Math.max(1,x-pad*.6-x0);
  const w=Math.ceil(x+pad+bleed), h=Math.ceil(fs*1.9+bleed*2);

  off.width=Math.ceil(w*PR);off.height=Math.ceil(h*PR);
  octx.setTransform(PR,0,0,PR,0,0);
  octx.fillStyle='#fff';octx.textBaseline='alphabetic';
  for(const it of items){octx.font=font(it.sz);octx.fillText(it.c,it.x,it.y)}

  // sample the coverage onto a grid, then wire each node to its right, lower
  // and diagonal neighbour: a triangulated mesh of the letterforms
  const img=octx.getImageData(0,0,off.width,off.height).data;
  const step=Math.max(2,Math.round((cfg.step||2.5)*PR));
  const cols=Math.floor(off.width/step),rows=Math.floor(off.height/step);
  const grid=new Int32Array(cols*rows).fill(-1);
  const nodes=[],edges=[];
  for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){
    const px=gx*step+(step>>1),py=gy*step+(step>>1);
    if(img[(py*off.width+px)*4+3]>96){
      grid[gy*cols+gx]=nodes.length;
      const nx=px/PR,ny=py/PR;
      nodes.push({hx:nx,hy:ny,x:nx,y:ny,vx:0,vy:0,s:vdc(nodes.length+1,2)});
    }
  }
  const link=(i,j)=>{if(i>=0&&j>=0)edges.push(i,j)};
  for(let gy=0;gy<rows;gy++)for(let gx=0;gx<cols;gx++){
    const i=grid[gy*cols+gx];if(i<0)continue;
    if(gx+1<cols)link(i,grid[gy*cols+gx+1]);
    if(gy+1<rows)link(i,grid[(gy+1)*cols+gx]);
    if(gx+1<cols&&gy+1<rows)link(i,grid[(gy+1)*cols+gx+1]);
  }
  /* The name contains an O, and the whole piece is about a hole in space.
     So the counter of that letter is measured out of the rendered glyph
     rather than guessed at — walk outward from its centre until the stroke
     is hit, in each direction — and handed back so it can be treated as an
     event horizon instead of as empty paper. */
  let hole=null;
  const oi=items.findIndex(it=>it.c==='O');
  if(oi>=0){
    const it=items[oi];
    const cx=it.x+it.w*.5, cy=baseline-it.sz*.36;
    const walk=(dx,dy)=>{
      for(let d=0;d<it.sz;d+=.5){
        const px=Math.round((cx+dx*d)*PR),py=Math.round((cy+dy*d)*PR);
        if(px<0||py<0||px>=off.width||py>=off.height)return d;
        if(img[(py*off.width+px)*4+3]>96)return d;
      }
      return it.sz*.3;
    };
    const rx=Math.min(walk(1,0),walk(-1,0)), ry=Math.min(walk(0,1),walk(0,-1));
    if(rx>it.sz*.06&&ry>it.sz*.06) hole={cx,cy,rx,ry};
  }

  return {nodes,edges,items,hole,w,h,x0,tw,fs,baseline,rest:step/PR,
          cx:x0+tw*.5,cy:baseline-fs*.30};
}

/* ---- the horizon in the O ----
   The name has a circle in the middle of it and the whole piece is about a
   hole in space, so that counter is treated as one: cut out of the canvas so
   the scene shows through it, ringed by its own accretion disk seen at an
   angle, and lit by a photon ring on the rim.

   The ring is drawn in two passes with the cut-out between them. The half
   running behind the hole is laid down first and is therefore clipped by the
   cut; the half running in front is drawn after and crosses over it. That is
   the whole trick — it is what makes a flat ellipse read as something
   orbiting a body rather than a line drawn around a letter. The near limb
   brightens as it comes toward you, exactly as the real disk does.        */
const RING_N=132;
const ringA=new Float32Array(RING_N),ringR=new Float32Array(RING_N),ringS=new Float32Array(RING_N);
for(let i=0;i<RING_N;i++){
  ringA[i]=i*GA;                       // evenly spread, never clumped
  ringR[i]=.86+vdc(i+1,2)*.30;
  ringS[i]=.55+vdc(i+1,3)*.75;

function drawHorizon(c,hole,o){
  if(!hole)return;
  const grow=o.grow||1, k=o.k===undefined?1:o.k;
  if(k<=.01)return;
  const cx=hole.cx, cy=hole.cy;
  const rx=hole.rx*grow, ry=hole.ry*grow, rr=Math.max(rx,ry);
  const tilt=-0.22+Math.sin(o.t*0.21)*0.06;     // the ring precesses, slowly
  const ca=Math.cos(tilt), sa=Math.sin(tilt);
  const orx=rx*2.35, ory=ry*0.62;
  const cs=`rgb(${o.R},${o.G},${o.B})`, hs=`rgb(${o.hiR},${o.hiG},${o.hiB})`;
  tintDab(dabA,cs);tintDab(dabB,hs);

  const prev=c.globalCompositeOperation;
  c.globalCompositeOperation='lighter';

  // the glow around the rim: an annulus with a transparent centre, so
  // nothing is ever put back inside the hole
  const gg=c.createRadialGradient(cx,cy,rr*.55,cx,cy,rr*3.0);
  gg.addColorStop(0,`rgba(${o.R},${o.G},${o.B},0)`);
  gg.addColorStop(.18,`rgba(${o.hiR},${o.hiG},${o.hiB},${(.28*k+o.glow*.3).toFixed(3)})`);
  gg.addColorStop(.55,`rgba(${o.R},${o.G},${o.B},${(.11*k).toFixed(3)})`);
  gg.addColorStop(1,`rgba(${o.R},${o.G},${o.B},0)`);
  c.fillStyle=gg;
  c.beginPath();c.arc(cx,cy,rr*3.0,0,6.2831853);c.fill();

  const dab=(a,i,front)=>{
    const rj=ringR[i];
    const px=cx+(Math.cos(a)*orx*rj)*ca-(Math.sin(a)*ory*rj)*sa;
    const py=cy+(Math.cos(a)*orx*rj)*sa+(Math.sin(a)*ory*rj)*ca;
    const dop=.34+.9*Math.max(Math.cos(a),0);   // the limb coming toward you
    const sz=rr*(.20+ringS[i]*.22)*(front?1.05:.9);
    c.globalAlpha=Math.min(1,(.16+dop*.5)*k*(front?1:.72));
    c.drawImage(dop>.9?dabB:dabA,px-sz*.5,py-sz*.5,sz,sz);
  };

  // the half running behind: drawn before the cut, so the cut clips it
  for(let i=0;i<RING_N;i++){
    const a=ringA[i]+o.t*(.22+ringR[i]*.10);
    if(Math.sin(a)>0)continue;
    dab(a,i,false);
  }
  c.globalAlpha=1;

  // the counter itself, cut clean out of the canvas
  c.globalCompositeOperation='destination-out';
  c.fillStyle='#000';
  c.beginPath();c.ellipse(cx,cy,rx*1.02,ry*1.02,0,0,6.2831853);c.fill();

  // and the half running in front, crossing over it
  c.globalCompositeOperation='lighter';
  for(let i=0;i<RING_N;i++){
    const a=ringA[i]+o.t*(.22+ringR[i]*.10);
    if(Math.sin(a)<=0)continue;
    dab(a,i,true);
  }
  c.globalAlpha=1;

  // the photon ring on the rim
  c.strokeStyle=`rgba(${o.hiR},${o.hiG},${o.hiB},${(.55*k+o.glow*.35).toFixed(3)})`;
  c.lineWidth=(1+o.glow*1.2)*(o.scale||1);
  c.beginPath();c.ellipse(cx,cy,rx,ry,0,0,6.2831853);c.stroke();
  // and the far side of the ring, bent up over the top of it
  c.strokeStyle=`rgba(${o.R},${o.G},${o.B},${(.30*k).toFixed(3)})`;
  c.lineWidth=(.8+o.glow*.6)*(o.scale||1);
  c.beginPath();
  c.ellipse(cx,cy,rx*1.30,ry*1.30,tilt,Math.PI*1.06,Math.PI*1.94);
  c.stroke();

  c.globalCompositeOperation=prev;
}

function buildMark(){

  // not get a wordmark sized for a tall one
  const ref=Math.min(innerWidth,innerHeight*1.75);
  const fs=Math.max(19,Math.min(40,ref*0.0312));
  // the sample step follows the stroke weight, or a lighter face would fall
  // through the grid and come out in pieces

  mkNodes=m.nodes;mkEdges=m.edges;mkW=m.w;mkH=m.h;

  mkDot={x:m.cx,y:m.cy,r:fs*.14};

  if(markRule)markRule.style.width=Math.round(m.tw)+'px';
  markCv.width=Math.ceil(m.w*PR);markCv.height=Math.ceil(m.h*PR);
  markCv.style.width=m.w+'px';markCv.style.height=m.h+'px';
  markCv.style.margin='-'+Math.round(fs*2.0)+'px';

const rulerEl=$('ruler'), RULER_N=23, rulerTicks=[];

function paintMark(dt,t){
  if(!mkNodes.length)return;
  // fast to come apart, slow to come back together
  shatter=damp(shatter,shatterT,shatterT>shatter?18:2.3,dt);

  const e=Math.min(1,energy*1.15);
  const c=tintRGB(e),R=(c[0]*255)|0,G=(c[1]*255)|0,B=(c[2]*255)|0;
  const hiR=Math.round(R+(233-R)*.35),hiG=Math.round(G+(253-G)*.35),hiB=Math.round(B+(255-B)*.35);
  const scanX=(scanY+1.7)/3.4;
  const live=shatter>.002;
  const pv=Math.min(1,pulseV);

  /* Everything in the frame bends around the core, and until now the mark
     did not. The singularity's screen position is known exactly, so each
     node is drawn toward it by an amount that falls off with distance —
     a shear across the word rather than a uniform nudge, so the letters
     lean into the hole they are named for. */
  if(++markRectAge>12&&markCv.getBoundingClientRect){
    markRectAge=0;
    try{markRect=markCv.getBoundingClientRect()}catch(_){markRect=null}
  }
  let px=0,py=0,pull=0;
  if(markRect&&coreScreen){
    px=coreScreen.x-markRect.left;py=coreScreen.y-markRect.top;
    pull=6.5*Math.min(2.2,P.lens);
  }

  const K=live?540:200, C=live?17:12.5;
  for(const n of mkNodes){
    const f=fieldJS(n.hx*.05,n.hy*.11,n.s*5.0,t*.55);
    const ang=f*3.6+n.s*6.2831853;
    const mag=shatter*(7+n.s*44);
    const rest=live?0:1;
    let tx=n.hx+Math.cos(ang)*mag+f*.55*rest;
    let ty=n.hy+Math.sin(ang)*mag*.62+f*.38*rest;
    if(pull>0){
      const dx=px-n.hx,dy=py-n.hy;
      const k=pull/(1+(dx*dx+dy*dy)/90000);
      const d=Math.max(1,Math.hypot(dx,dy));
      tx+=dx/d*k;ty+=dy/d*k;
    }
    n.vx+=(tx-n.x)*K*dt;n.vy+=(ty-n.y)*K*dt;
    n.vx*=Math.exp(-C*dt);n.vy*=Math.exp(-C*dt);
    n.x+=n.vx*dt;n.y+=n.vy*dt;
  }

  // the satellites orbit the horizon in the O and fall into it
  const hx=mkHole?mkHole.cx:mkX0+mkTW*.5, hy=mkHole?mkHole.cy:mkDot.y;
  const orx=mkTW*.46, ory=mkFS*.80;
  for(const sv of mkSats){
    sv.a+=sv.sp*dt;
    if(sv.p===undefined)sv.p=sv.ph/6.2831853;
    sv.p=(sv.p+dt*(.055+sv.rx*.05))%1;
    const inn=sv.p*sv.p*(3-2*sv.p);                 // the fall accelerates
    const wob=fieldJS(Math.cos(sv.a),Math.sin(sv.a),sv.ph,t*.4);
    const rr=1-inn*.93;
    sv.x=hx+Math.cos(sv.a+sv.ph)*orx*sv.rx*rr*(1+wob*.10+shatter*.5);
    sv.y=hy+Math.sin(sv.a*1.3+sv.ph)*ory*sv.ry*rr*(1+wob*.14+shatter*.6);
    sv.k=Math.min(1,(1-sv.p)*3.2)*Math.min(1,sv.p*8);
  }

  mctx.clearRect(0,0,mkW,mkH);
  mctx.globalCompositeOperation='lighter';

  // edges, dropped once they have stretched past tearing
  const tear=mkRest*2.6;
  mctx.beginPath();
  for(let k=0;k<mkEdges.length;k+=2){
    const a=mkNodes[mkEdges[k]],b=mkNodes[mkEdges[k+1]];
    const dx=b.x-a.x,dy=b.y-a.y;

    mctx.moveTo(a.x,a.y);mctx.lineTo(b.x,b.y);
  }
  mctx.strokeStyle='rgba('+R+','+G+','+B+','+(.26+e*.16+surge*.12).toFixed(3)+')';
  mctx.lineWidth=1.1;mctx.stroke();

  // nodes as soft dabs: the same material as the scene, not squares
  tintDab(dabA,'rgb('+R+','+G+','+B+')');
  tintDab(dabB,'rgb('+hiR+','+hiG+','+hiB+')');
  const base=mkRest*2.1, lit=mkRest*3.6;
  mctx.globalAlpha=.32+e*.16+surge*.10;
  for(const n of mkNodes){
    // a slow field over the whole word, so the mesh is never uniformly lit
    const b=base*(.82+.36*(fieldJS(n.hx*.035,n.hy*.09,n.s*3.,t*.35)*.5+.5));
    mctx.drawImage(dabA,n.x-b*.5,n.y-b*.5,b,b);
  }
  for(const n of mkNodes){
    const d=(n.hx-mkX0)/mkTW-scanX;
    const k=Math.exp(-(d*d)/.012);
    if(k<=.10)continue;
    // the dab is centred on the node and grows with the plane's approach
    const sz=lit*(.42+k*.75);
    mctx.globalAlpha=.35+k*.55;
    mctx.drawImage(dabB,n.x-sz*.5,n.y-sz*.5,sz,sz);
  }
  mctx.globalAlpha=1;

  // the same chromatic split the lens puts on the frame
  const ck=Math.max(0,Math.min(1,P.shift*.7+Math.max(0,P.bloom-1.35)/1.75*.5+pulseV*.4));
  if(ck>.05){
    const o=.5+ck*2.4;
    tintDab(dabA,'rgb(255,58,58)');
    mctx.globalAlpha=ck*.26;
    for(let i=0;i<mkNodes.length;i+=2) mctx.drawImage(dabA,mkNodes[i].x-o-base*.5,mkNodes[i].y-base*.5,base,base);
    tintDab(dabA,'rgb(58,168,255)');
    for(let i=1;i<mkNodes.length;i+=2) mctx.drawImage(dabA,mkNodes[i].x+o-base*.5,mkNodes[i].y-base*.5,base,base);
    mctx.globalAlpha=1;
    tintDab(dabA,'rgb('+R+','+G+','+B+')');
  }

  // satellites, and the links they make as they pass
  const reach=mkFS*1.5, reach2=reach*reach;
  mctx.lineWidth=1;
  for(const sv of mkSats){
    if(sv.k<=.01)continue;
    let n1=null,d1=reach2,n2=null,d2=reach2;
    for(const n of mkNodes){
      const dx=n.x-sv.x,dy=n.y-sv.y,d=dx*dx+dy*dy;
      if(d<d1){d2=d1;n2=n1;d1=d;n1=n}
      else if(d<d2){d2=d;n2=n}
    }
    if(n1){
      mctx.beginPath();
      mctx.moveTo(sv.x,sv.y);mctx.lineTo(n1.x,n1.y);
      if(n2){mctx.moveTo(sv.x,sv.y);mctx.lineTo(n2.x,n2.y)}
      mctx.strokeStyle='rgba('+R+','+G+','+B+','+((1-Math.sqrt(d1)/reach)*.5*sv.k).toFixed(3)+')';
      mctx.stroke();
    }
    const sr=mkFS*(.13+beatFlash*.03+pv*.05)*(.5+sv.k*.5);
    mctx.globalAlpha=sv.k;
    mctx.drawImage(dabA,sv.x-sr,sv.y-sr,sr*2,sr*2);
    mctx.globalAlpha=sv.k*.9;
    mctx.drawImage(dabB,sv.x-sr*.34,sv.y-sr*.34,sr*.68,sr*.68);
    mctx.globalAlpha=1;
  }

  drawHorizon(mctx,mkHole,{
    R,G,B,hiR,hiG,hiB,t,
    grow:1+pv*.20+shatter*.32,
    glow:pv*.55+surge*.35,
    scale:1
  });
  mctx.globalCompositeOperation='source-over';
}

let paintedMode='';

  if(paintedMode===label)return;
  paintedMode=label;
