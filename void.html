/* ==============================================================
   ADAPTIVE QUALITY
   The scene is heavy by design, and there is no way to know in
   advance what it is running on. So the frame time is watched, and
   when it slips the work is cut in a deliberate order: first the
   trail pass, then the population, then the resolution, then the
   lensed images. Each step is held for a few seconds before another
   is considered, and every one of them is handed back the moment the
   frame recovers - a machine that can afford the full scene never
   sees a reduced one, and a machine that cannot never stutters.
   ============================================================== */
const QL={level:0,ema:16.7,cool:4};
const shrinkable=[];
let markEvery=1,markFrame=0,FX=true;
function collectShrinkable(){
  scene.traverse(o=>{
    if(o.isPoints&&o.geometry&&o.geometry.attributes.position){
      const n=o.geometry.attributes.position.count;
      if(n>=1200)shrinkable.push({g:o.geometry,full:n});
    }
  });
}
function setQuality(l){
  QL.level=l;
  const frac=[1,1,.62,.38][l];
  for(const sk of shrinkable)sk.g.setDrawRange(0,Math.floor(sk.full*frac));
  TRAILS=(l<1)&&!reduced;
  if(!TRAILS)outMat.uniforms.uGain.value=0;
  markEvery=l>=3?3:(l>=2?2:1);
  FX=(l<2);                                   // streaks and rays go at level 2
  for(const pt of diskLensPts)pt.visible=(l<3);
  const pr=[PR,PR,Math.min(PR,1.25),1][l];
  if(pr!==RPR){RPR=pr;renderer.setPixelRatio(RPR);shared.uPR.value=RPR;applySize()}
}
collectShrinkable();

/* ==============================================================
   LOADING
   The same mesh as the wordmark, drawn large. Every node starts far
   out in the dark on a golden-angle bearing and flies home as the
   core comes up, leaving a streak behind it. Edges are drawn only
   between nodes that have both arrived, so the triangulation knits
   itself together rather than fading in. An arc closes around the
   whole thing as it loads, and when the handshake finishes the mesh
   is thrown outward and the interface is behind it.
   ============================================================== */
const bootCv=$('bootstage'), bctx=bootCv&&bootCv.getContext('2d');
const bootPctEl=$('bootpct');
let bootMesh=null,bootProg=0,bootTarget=0,bootExit=0;

function buildBootMesh(){
  if(!bootCv)return;
  const bref=Math.min(innerWidth,innerHeight*1.9);
  let fs=Math.max(26,Math.min(84,bref*0.066));
  bootMesh=sampleGlyphMesh(MARK_GLYPHS,fs,{step:Math.max(2.6,fs*.072),bleed:1.3,track:.21});
  // a wide face on a narrow window would run off the edge, so it is measured
  // and set again at whatever size actually fits
  if(bootMesh.w>innerWidth*.86){
    fs=Math.max(20,fs*(innerWidth*.86)/bootMesh.w);
    bootMesh=sampleGlyphMesh(MARK_GLYPHS,fs,{step:Math.max(2.4,fs*.072),bleed:1.3,track:.21});
  }
  bootCv.width=Math.ceil(bootMesh.w*PR);bootCv.height=Math.ceil(bootMesh.h*PR);
  bootCv.style.width=bootMesh.w+'px';bootCv.style.height=bootMesh.h+'px';
  bctx.setTransform(PR,0,0,PR,0,0);
  // each node's point of origin: a bearing off the golden angle, far out
  bootMesh.nodes.forEach((n,i)=>{
    const a=i*GA, r=bootMesh.w*(.55+vdc(i+1,3)*1.05);
    n.sx=bootMesh.cx+Math.cos(a)*r;
    n.sy=bootMesh.cy+Math.sin(a)*r*.62;
    n.px=n.sx;n.py=n.sy;
    n.d=(n.hx-bootMesh.x0)/bootMesh.tw;      // staggers the arrival left to right
  });
}
if(bootCv)buildBootMesh();

function paintBoot(dt,t){
  if(!bootMesh||!bctx)return;
  bootProg=damp(bootProg,bootTarget,3.4,dt);
  const m=bootMesh, c=bctx;
  const p=Math.min(1,bootProg);
  // the palette warms as it loads: cold blue through cyan into mint
  const col=hueRotJS(rampJS(.05+p*.40),.35);
  const R=(col[0]*255)|0,G=(col[1]*255)|0,B=(col[2]*255)|0;
  const rgba=a=>'rgba('+R+','+G+','+B+','+a+')';

  c.clearRect(0,0,m.w,m.h);

  // nodes fly home in a wave across the word
  for(const n of m.nodes){
    const k=Math.max(0,Math.min(1,(p-n.d*.34)/.62));
    const e=k*k*(3-2*k);
    n.px=n.x;n.py=n.y;
    const wob=fieldJS(n.hx*.02,n.hy*.05,n.s*4,t*.5)*(1-e)*m.fs*.10;
    n.x=n.sx+(n.hx-n.sx)*e+wob;
    n.y=n.sy+(n.hy-n.sy)*e+wob*.6;
    n.k=e;
    if(bootExit>0){
      const a=n.s*6.2831853+n.hx*.04;
      n.x+=Math.cos(a)*bootExit*m.fs*2.2;
      n.y+=Math.sin(a)*bootExit*m.fs*1.5;
    }
  }

  const fade=1-bootExit;

  // the streak each node leaves while it is still travelling
  c.beginPath();
  for(const n of m.nodes){
    if(n.k>.985)continue;
    c.moveTo(n.px,n.py);c.lineTo(n.x,n.y);
  }
  c.strokeStyle=rgba((.30*fade).toFixed(3));c.lineWidth=1;c.stroke();

  // the triangulation, formed only between nodes that have arrived
  const tear=m.rest*2.6;
  c.beginPath();
  for(let i=0;i<m.edges.length;i+=2){
    const a=m.nodes[m.edges[i]],b=m.nodes[m.edges[i+1]];
    if(a.k<.72||b.k<.72)continue;
    const dx=b.x-a.x,dy=b.y-a.y;
    if(dx*dx+dy*dy>tear*tear)continue;
    c.moveTo(a.x,a.y);c.lineTo(b.x,b.y);
  }
  c.strokeStyle=rgba((.34*fade).toFixed(3));c.stroke();

  // the nodes themselves, brightest at the moment of arrival - drawn with
  // the same soft dab as the mark, so the two are one material
  tintDab(dabA,'rgb('+R+','+G+','+B+')');
  const prev=c.globalCompositeOperation;
  c.globalCompositeOperation='lighter';
  for(const n of m.nodes){
    const land=Math.exp(-Math.pow((n.k-.92)/.14,2));
    c.globalAlpha=Math.min(1,(.30+n.k*.40+land*.55)*fade);
    const sz=(m.rest*1.9)*(1+land*1.1);
    c.drawImage(dabA,n.x-sz*.5,n.y-sz*.5,sz,sz);
  }
  c.globalAlpha=1;c.globalCompositeOperation=prev;

  // as the last nodes land, the O opens into the same object the mark carries
  if(m.hole&&p>.80){
    const k=Math.min(1,(p-.80)/.20)*fade;
    drawHorizon(c,m.hole,{
      R,G,B,hiR:Math.round(R+(233-R)*.45),hiG:Math.round(G+(253-G)*.45),
      hiB:Math.round(B+(255-B)*.45),
      t,grow:k,glow:.15+(1-k)*.5,k,scale:1.4
    });
  }

  // the arc closing round the word as it loads
  const ar=m.tw*.62;
  c.strokeStyle=rgba((.14*fade).toFixed(3));c.lineWidth=1;
  c.beginPath();c.arc(m.cx,m.cy,ar,0,6.2831853);c.stroke();
  c.strokeStyle=rgba((.85*fade).toFixed(3));c.lineWidth=1.6;
  c.beginPath();c.arc(m.cx,m.cy,ar,-Math.PI/2,-Math.PI/2+p*6.2831853);c.stroke();
  // and the point riding the head of it
  const ha=-Math.PI/2+p*6.2831853;
  c.fillStyle=rgba((.95*fade).toFixed(3));
  c.beginPath();c.arc(m.cx+Math.cos(ha)*ar,m.cy+Math.sin(ha)*ar,2.4,0,6.2831853);c.fill();
}

/* ==============================================================
   LOOP
   ============================================================== */
let scanY=-1.6,camRoll=0;
let horizonFall=0;
let horizonSpin=0;
const scanProbe=new THREE.Vector3();
const lensC=new THREE.Vector3(),lensE=new THREE.Vector3(),lensUp=new THREE.Vector3();
const coreScreen={x:0,y:0};
const scanEl=$('scanline'), cycleEl=document.querySelector('#cycle i');
const clock=new THREE.Clock();
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;
let TRAILS=!reduced;
outMat.uniforms.tTrail.value=rtT1.texture;
if(!TRAILS) outMat.uniforms.uGain.value=0;
let booted=false;

/* ==============================================================
   CAMERA DIRECTOR
   The camera is no longer permanently in motion. It sits, holds a
   readable frame, and only moves when the machine does something
   worth looking at: a message sent, a reply beginning, a state
   change, an impact. Every move is an orbit — a small angular walk
   around the core, held then eased back — because rotation reads as
   depth without ever costing legibility. Dolly is deliberately tiny:
   the frame should feel alive, not seasick.
   ============================================================== */
const CSSROOT=document.documentElement.style;
const CINE={
  yaw:0,pitch:0,roll:0,dolly:0,
  tyaw:0,tpitch:0,troll:0,tdolly:0,
  hold:0,decay:1.4,weight:0,live:0,idleIn:16+Math.random()*10,
  shot(o){
    const w=(Math.abs(o.yaw||0)+Math.abs(o.pitch||0))*3+Math.abs(o.dolly||0);
    if(this.hold>0&&w<this.weight*.85)return;      // don't cut a bigger move short
    this.weight=w;
    this.tyaw=o.yaw||0;this.tpitch=o.pitch||0;
    this.troll=o.roll||0;this.tdolly=o.dolly||0;
    this.hold=o.hold||.4;this.decay=o.decay||1.4;
    this.live=1;
    document.body.classList.add('cine');
    this.idleIn=18+Math.random()*12;
  },
  update(dt,quiet){
    if(this.hold>0)this.hold-=dt;
    else{
      const k=Math.exp(-dt/this.decay);
      this.tyaw*=k;this.tpitch*=k;this.troll*=k;this.tdolly*=k;
      if(Math.abs(this.tyaw)+Math.abs(this.tpitch)+Math.abs(this.tdolly)<2e-4){
        this.tyaw=this.tpitch=this.troll=this.tdolly=0;this.weight=0;
      }
    }
    // when nothing has happened for a while the frame takes one slow,
    // wide orbit of its own — the only unprompted camera move there is
    if(quiet){
      this.idleIn-=dt;
      if(this.idleIn<=0)this.shot({yaw:(Math.random()<.5?-1:1)*(.10+Math.random()*.07),
                                   pitch:(Math.random()-.5)*.05,hold:3.2,decay:3.4});
    }
    const sp=this.hold>0?2.1:1.5;                  // arrive briskly, leave slowly
    this.yaw  =damp(this.yaw,  this.tyaw,  sp,dt);
    this.pitch=damp(this.pitch,this.tpitch,sp,dt);
    this.roll =damp(this.roll, this.troll, sp,dt);
    this.dolly=damp(this.dolly,this.tdolly,sp*1.25,dt);
    const m=Math.min(1,(Math.abs(this.yaw)+Math.abs(this.pitch))*5+Math.abs(this.dolly)*1.6);
    this.live=damp(this.live,m,3.2,dt);
    if(this.live<.04&&this.hold<=0)document.body.classList.remove('cine');
    CSSROOT.setProperty('--cine',this.live.toFixed(3));
    CSSROOT.setProperty('--cine-roll',(this.roll*12).toFixed(3)+'deg');
  }
};

function tick(){
  requestAnimationFrame(tick);
  const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;

  // frame-time watchdog: a slow exponential average, so one hitch never
  // triggers a downgrade but a genuinely struggling machine always does
  QL.ema=QL.ema*.93+Math.min(dt*1000,120)*.07;
  QL.cool-=dt;
  if(booted&&QL.cool<=0){
    if(QL.ema>27&&QL.level<3){setQuality(QL.level+1);QL.cool=4}
    else if(QL.ema<15.5&&QL.level>0){setQuality(QL.level-1);QL.cool=7}
  }

  amp=damp(amp,ampT,10,dt);ampT=decay(ampT,7,dt);pulseV=decay(pulseV,4.4,dt);
  ptrSX=damp(ptrSX,ptrX,2.6,dt);ptrSY=damp(ptrSY,ptrY,2.6,dt);
  chase(dt);

  // routine clock: the agent drives it when attached, the demo when locked,
  // and the idle cycler when there is nothing else to say
  if(booted){
    if(mode!=='idle'){
      modeT+=dt;
      const h=MODES[mode]&&MODES[mode].hold;
      if(h)h(t,modeT);                       // the state keeps shaping itself
    }
    if(pendingMode&&modeT>=MIN_DWELL){const p=pendingMode;pendingMode=null;startMode(p)}

    if(demoLock){
      demoT-=dt;
      if(demoT<=0){
        if(demoQueue.length){
          const nx=demoQueue.shift();
          startMode(nx);demoT=4.6+gr()*2.6;
          log('void','<b>demo</b> '+esc(nx),'step');
        }else{
          demoLock=false;endMode();
          log('void','<b>demo</b> released','step');
        }
      }
    }else if(!ATTACHED){
      if(mode!=='idle'){ if(modeT>=5+gr()*4)endMode() }
      else { idleFor+=dt; if(idleFor>=nextIn)startMode(pickMode()) }
    }else{
      // sustained overload tips over into nova, and falls back when it eases
      if(mode==='overload'&&modeT>6&&energy>.88)requestMode('nova');
      else if(mode==='nova'&&(modeT>7||energy<.75))requestMode('overload');
      // attached and quiet: settle into something ambient rather than stop
      if(mode==='idle'&&!LIVE.busy){
        idleFor+=dt;
        if(idleFor>=90)startMode('dream');
        else if(idleFor>=22)startMode(pickMode(AMBIENT_MODES));
      }else if(AMBIENT_MODES.indexOf(mode)>=0&&!LIVE.busy&&modeT>=20+gr()*14){
        endMode();
      }
    }

    // the metronome: everything unscheduled lands on a subdivision of it
    const b=Math.floor(t/BEAT);
    if(b!==lastBeat){lastBeat=b;onBeat(b)}
  }
  diskWave=decay(diskWave,.55,dt);
  hexBurst=decay(hexBurst,1.6,dt);
  beatFlash=decay(beatFlash,3.4,dt);
  surge=decay(surge,1.5,dt);

  const idle=.05+Math.sin(t*.7)*.02;
  shared.uTime.value=t;
  shared.uAmp.value=amp+idle;
  shared.uPulse.value=pulseV;
  shared.uRadK.value=P.cloudR;
  shared.uEnergy.value=energy;
  shared.uTint.value=P.tint;
  simTime=t;
  // focus on the core itself, and open the aperture as the state pushes the
  // camera in - close work is shallow work
  const focusBreath=Math.sin(t*HR[0]*.31)*.16;
  shared.uFocus.value=camera.position.length()+focusBreath-(energy*.22);
  shared.uAperture.value=.050+Math.max(0,1-P.zoom)*.13+energy*.025+pulseV*.035;

  scanY+=dt*P.scanSpd*scanDir;
  if(scanY>1.7)scanY=-1.7; else if(scanY<-1.7)scanY=1.7;
  shared.uScan.value=scanY;

  // the wordmark reads the same two signals the core does
  const rootStyle=document.documentElement.style;
  rootStyle.setProperty('--scan',(((scanY+1.7)/3.4)*140-20).toFixed(1)+'%');
  const chromaK=Math.max(0,Math.min(1,P.shift*.7+Math.max(0,P.bloom-1.35)/1.75*.5+pulseV*.4));
  rootStyle.setProperty('--chroma',(.4+chromaK*2.6).toFixed(2)+'px');
  rootStyle.setProperty('--chroma-k',chromaK.toFixed(3));
  rootStyle.setProperty('--talk',Math.min(1,amp*2.2).toFixed(3));
  rootStyle.setProperty('--energy',energy.toFixed(3));
  // the same two envelopes the core runs on, handed to the stylesheet so the
  // chrome can breathe with it instead of animating on its own timers
  rootStyle.setProperty('--pulse',Math.min(1,pulseV).toFixed(3));
  rootStyle.setProperty('--beat',beatFlash.toFixed(3));
  rootStyle.setProperty('--surge',Math.min(1,surge).toFixed(3));
  // parallax: the same smoothed pointer the camera uses, so the chrome and
  // the scene lean together
  rootStyle.setProperty('--px',ptrSX.toFixed(4));
  rootStyle.setProperty('--py',ptrSY.toFixed(4));
  // impacts shake the content but never the tube: the screen surface is
  // fixed, what is being displayed on it is not
  const sh=pulseV*pulseV*5.5;
  rootStyle.setProperty('--shx',(Math.sin(t*47.3)*sh).toFixed(2)+'px');
  rootStyle.setProperty('--shy',(Math.cos(t*39.1)*sh*.7).toFixed(2)+'px');
  if(pointerSeen){
    retLX=damp(retLX,retX,9,dt);retLY=damp(retLY,retY,9,dt);
    rootStyle.setProperty('--mx',retX.toFixed(1)+'px');
    rootStyle.setProperty('--my',retY.toFixed(1)+'px');
    rootStyle.setProperty('--ldx',(retLX-retX).toFixed(1)+'px');
    rootStyle.setProperty('--ldy',(retLY-retY).toFixed(1)+'px');
  }

  // project the scan plane out of the core and onto the screen
  scanProbe.set(0,scanY,0).project(camera);
  const sy=(1-scanProbe.y)*0.5*H();
  scanEl.style.top=sy.toFixed(1)+'px';
  scanScreenY=sy;
  paintRuler(sy);
  scanEl.style.opacity=(0.10+Math.min(.5,P.scanSpd*0.09)+pulseV*.2).toFixed(3);

  // routine clock along the top edge. Real tool calls have no known
  // duration, so it eases toward 92% and only completes when the tool does.
  if(mode!=='idle'){
    cycleEl.style.width=(92*(1-Math.exp(-modeT/6))).toFixed(1)+'%';
    cycleEl.style.opacity='1';
  }else{
    cycleEl.style.opacity='0';
  }

  shellMats.forEach(m=>m.uniforms.uShellK.value=P.shellR);
  ringMats.forEach(m=>m.uniforms.uRingK.value=P.ringK);
  helixMat.uniforms.uHelixK.value=P.helixR;
  for(const m of diskMats){
    m.uniforms.uDiskK.value=P.diskK;
    m.uniforms.uSpin.value=P.diskSpin;
    m.uniforms.uWave.value=diskWave;
    m.uniforms.uLensK.value=P.lens;          // stronger curvature, brighter images
  }
  infallMat.uniforms.uDiskK.value=P.diskK;
  infallMat.uniforms.uRate.value=P.infall;
  starMat.uniforms.uStarK.value=P.starK;
  gridMat.uniforms.uGrid.value=P.grid;
  rippleMat.uniforms.uRipple.value=P.ripple;
  jetMat.uniforms.uJet.value=P.jet;
  dialMat.uniforms.uOpacity.value=.34*P.dialK+surge*.2;
  gimbalMats.forEach((m,i)=>m.uniforms.uSpeed.value=[.11,-.07,.05][i]*(1+P.diskSpin*.35));
  fades.forEach(f=>f.u.value=damp(f.u.value,f.t,2.6,dt));

  velX=decay(velX,5.7,dt);velY=decay(velY,5.7,dt);
  spinX+=velX;spinY+=velY+(reduced?0:dt*P.spin);
  spinX=Math.max(-1,Math.min(1,spinX));
  core.rotation.x=spinX+ptrSY*.20;
  core.rotation.y=spinY+ptrSX*.35;
  // slow breathing, so the core is never completely still
  core.scale.setScalar(1+Math.sin(t*HR[1]*.53)*.014+amp*.05+pulseV*.07);
  // and it is not pinned to the middle: states push it off centre, and the
  // chrome is left holding the negative space
  core.position.x=damp(core.position.x,P.offX,2.2,dt);
  core.position.y=damp(core.position.y,P.offY,2.2,dt);
  halo.position.copy(core.position);
  for(const wv of waves) wv.mesh.position.copy(core.position);
  moteMat.uniforms.uCenter.value.copy(core.position);

  // every rotation rate is a rung of the same harmonic ladder, so the
  // shells and rings keep drifting in and out of phase with each other
  // instead of beating against unrelated speeds
  shellOuter.rotation.y=t*HR[0]*.22;
  shellMid.rotation.y=-t*HR[2]*.58;shellMid.rotation.x=t*HR[1]*.29;
  shellIn.rotation.y=t*HR[3]*.70;shellIn.rotation.z=t*HR[2]*.45;
  r1.rotation.y=t*HR[2]*.58;
  r2.rotation.x=-.85+Math.sin(t*HR[0])*.32;r2.rotation.y=-t*HR[1]*.41;
  r3.rotation.z=-.18+Math.cos(t*HR[0]*PHI)*.26;r3.rotation.y=t*HR[0]*.34;
  r4.rotation.x=1.2+Math.sin(t*HR[0]/PHI)*.18;r4.rotation.y=t*HR[1]*.29;

  // the disk precesses rather than sitting on a fixed plane, so its
  // silhouette against the core keeps changing
  // the gimbal precesses on three unrelated rungs, so its silhouette never
  // repeats; the dial keeps the disk's plane and turns against it
  // shared live energy colour for arcs, shields and lamps
  const ec=tintRGB(Math.min(1,energy*1.15));
  const eCol=new THREE.Color(ec[0],ec[1],ec[2]);

  gimbal.rotation.x=Math.sin(t*HR[0]*.31)*.30;
  gimbal.rotation.y=t*HR[0]*.12;
  gimbal.rotation.z=Math.cos(t*HR[0]*.23)*.22;
  g1.rotation.z=.42+Math.sin(t*HR[1]*.27)*.18;
  g2.rotation.x=-1.15+Math.cos(t*HR[1]*.19)*.16;
  g3.rotation.y=t*HR[1]*.13;
  dialGroup.rotation.x=1.09+Math.sin(t*HR[0]*.38)*.13+P.tilt;
  dialGroup.rotation.y=-t*HR[0]*.19;
  dialGroup.rotation.z=.20+Math.cos(t*HR[0]*.29)*.11;

  diskGroup.rotation.x=1.09+Math.sin(t*HR[0]*.38)*.13+P.tilt;
  diskGroup.rotation.z=.20+Math.cos(t*HR[0]*.29)*.11;
  // the sky turns almost imperceptibly, and leans away from the pointer
  starGroup.rotation.y=t*HR[0]*.024;
  starGroup.rotation.x=Math.sin(t*HR[0]*.17)*.05-ptrSY*.06;

  // the shadow contracts as the core heats — hot cores swallow less light
  horizon.scale.setScalar(.27*(1-Math.min(.42,energy*.45))*P.cloudR*P.horizonK);

  // halo and shockwaves are billboards: face the camera, ignore the core's
  // own rotation entirely
  halo.quaternion.copy(camera.quaternion);
  const hu=halo.material.uniforms;
  hu.uR.value=damp(hu.uR.value,(.30+P.cloudR*.30)*P.haloR,4,dt);
  hu.uW.value=.022+amp*.05+pulseV*.06;
  hu.uHue.value=Math.sin(t*HR[0]*.62)*.30;
  hu.uOpacity.value=.55+amp*.5+pulseV*.5+energy*.35;
  for(const w of waves){
    const m=w.mesh.material.uniforms;
    if(w.life<=0){m.uOpacity.value=0;continue}
    w.life=Math.max(0,w.life-dt*.62);
    const e=1-w.life;                        // 0 at the core, 1 at the rim
    w.mesh.quaternion.copy(camera.quaternion);
    // an inward wave is the same ring run backwards: it arrives rather than
    // departs, which is what a state that pulls things in should look like
    m.uR.value=w.inward?(.50-e*.44):(.04+e*.46);
    m.uW.value=.006+e*.055;
    m.uOpacity.value=Math.pow(w.life,1.6)*(.55+(w.power||1)*.35);
    m.uBright.value=1.4+w.life*1.6;
  }

  // energy colour drives arcs, shields and lamp too
  for(const h of hexes){
    // a shield lights when the scan plane arrives at its latitude: the
    // cascade is caused rather than sprinkled, so it reads as a sweep
    const prox=Math.max(0,1-Math.abs(h.y-scanY)/.40);
    h.flash=Math.max(h.flash*Math.exp(-2.4*dt),prox*prox*(.5+hexBurst*.5));
    h.mesh.material.opacity=Math.min(.6,h.base*P.hexOp+h.flash*.22);
    h.edge.material.opacity=Math.min(.9,h.eBase*P.hexOp+h.flash*.5);
    h.mesh.material.color.copy(eCol);h.edge.material.color.copy(eCol);
  }
  for(const pl of plates){
    pl.mesh.material.color.copy(eCol);
  }
  lamp.material.color.copy(eCol);
  lamp.scale.setScalar(1.8+Math.sin(t*HR[3]*.72)*.14+amp*1.8+pulseV*1.6
                      +(P.bloom-1.35)*.5+surge*1.1);
  lamp.material.opacity=.5+amp*.4+pulseV*.45+surge*.35;
  lampIn.scale.setScalar(.5+pulseV*.6+amp*.4+surge*.7);
  lampIn.material.opacity=.7+pulseV*.3+surge*.3;

  arcTimer-=dt;
  if(arcTimer<=0){
    const a=arcs.find(a=>a.life<=0);
    if(a)spawnArc(a);
    arcTimer=1/Math.max(.15,P.arcRate)*(.62+gr()*.76);
  }
  for(const a of arcs){
    a.line.material.color.copy(eCol);
    if(a.life<=0){a.line.material.opacity=0;continue}
    a.life-=dt;
    a.line.material.opacity=Math.max(0,a.life)*.7;
    for(let i=0;i<a.segs;i++){
      const f=i/(a.segs-1);
      const v=new THREE.Vector3().lerpVectors(a.start,a.end,f);
      v.normalize().multiplyScalar((1+Math.sin(f*Math.PI)*.3)*P.cloudR);
      // the wobble is a field sample, not noise: neighbouring points on the
      // arc stay related, so it bends instead of buzzing
      const j=.075*Math.sin(f*Math.PI);
      v.x+=fieldJS(v.x*3,v.y*3,v.z*3,t*1.7)*j;
      v.y+=fieldJS(v.y*3+7,v.z*3,v.x*3,t*1.7)*j;
      v.z+=fieldJS(v.z*3,v.x*3+3,v.y*3,t*1.7)*j;
      a.pos[i*3]=v.x;a.pos[i*3+1]=v.y;a.pos[i*3+2]=v.z;
    }
    a.line.geometry.attributes.position.needsUpdate=true;
  }

  // Event-horizon suction. Activity charges a nonlinear fall envelope;
  // impacts can throw the camera deep toward the horizon, while release is
  // deliberately slower so the viewer feels pulled in before escaping.
  CINE.update(dt,!LIVE.busy&&energy<.22&&pulseV<.05);

  // The ambient drift is small enough to read as a held frame rather than a
  // moving one; anything larger has to be asked for by the director.
  const orbit=reduced?0:Math.sin(t*HR[0]*.21)*.075;
  const zoomBreath=reduced?0:(Math.sin(t*HR[0]*.105)*.012+Math.sin(t*HR[1]*.061)*.006);
  const suctionDrive=Math.max(0,Math.min(1,
    pulseV*.92+surge*.82+Math.max(0,energy-.38)*1.05+(LIVE.busy?.12:0)));
  const fallTarget=Math.pow(suctionDrive,1.55)*.42;   // the pull is felt, not obeyed
  horizonFall=damp(horizonFall,fallTarget,fallTarget>horizonFall?5.2:.9,dt);
  const fall=horizonFall*horizonFall*(3-2*horizonFall);
  horizonSpin+=dt*(.12+fall*2.7);

  const workPush=LIVE.busy?-.022:.006;
  const energyPush=-energy*.016;
  const statePush=(mode==='think'||mode==='ingest'||mode==='spiral')?-.014:
                  ((mode==='dream'||mode==='drift')?.008:0);
  const zoomFactor=1+zoomBreath+workPush+energyPush+statePush;
  const impactZoom=pulseV*.20+surge*.14+beatFlash*.02;
  const baseZ=distUser*P.zoom*zoomFactor-impactZoom+CINE.dolly;
  // even at full suction the frame only leans in — the plunge is now an
  // approach, not a dive, so nothing important ever leaves the screen
  const plungeZ=Math.max(4.6,distUser*P.zoom*.72)+Math.sin(horizonSpin*.73)*.06;
  const targetZ=Math.max(3.6,baseZ+(plungeZ-baseZ)*fall);
  camera.position.z=damp(camera.position.z,targetZ,2.7+fall*5.0,dt);

  // The lens breathes across a narrow band. A wide FOV swing was doing the
  // work the orbit does better, and doing it to the reader's stomach.
  const fovBase=46+(reduced?0:Math.sin(t*HR[0]*.074)*.4)
                  +(LIVE.busy?-.7:.2)-energy*.3;
  const fovTarget=fovBase+fall*5.0-pulseV*.7-CINE.live*1.1;
  camera.fov=damp(camera.fov,Math.max(42,Math.min(53,fovTarget)),3.0+fall*5.0,dt);
  camera.updateProjectionMatrix();

  const handX=(Math.sin(t*.73)*.018+Math.sin(t*1.91)*.007)*(1-fall*.75);
  const handY=(Math.cos(t*.61)*.015+Math.cos(t*1.57)*.006)*(1-fall*.75);
  const spiralR=(.20+.32*fall)*(1-fall*.42);
  const suckX=core.position.x+Math.cos(horizonSpin)*spiralR*fall;
  const suckY=core.position.y+Math.sin(horizonSpin*1.13)*spiralR*.68*fall;
  // the director's yaw and pitch are angles about the core, converted to the
  // arc a camera at this distance would actually travel
  const arm=camera.position.z;
  const freeX=ptrSX*-.3+orbit+handX+Math.sin(CINE.yaw)*arm;
  const freeY=.3+ptrSY*-.2+Math.sin(t*HR[0]*.16)*.16+handY+Math.sin(CINE.pitch)*arm;
  camera.position.x=damp(camera.position.x,freeX+(suckX-freeX)*fall,3.0+fall*7.5,dt);
  camera.position.y=damp(camera.position.y,freeY+(suckY-freeY)*fall,3.0+fall*7.5,dt);
  camera.lookAt(core.position.x*(.08+.82*fall),core.position.y*(.08+.82*fall),0);
  camera.rotateZ(P.camRoll+Math.sin(t*HR[0]*.09)*.012
                 +Math.sin(horizonSpin)*fall*.06+CINE.roll);

  // The interface lags behind the plunge slightly, creating depth while
  // remaining readable and anchored to the display surface.
  rootStyle.setProperty('--camera-zoom',Math.max(-1,Math.min(1,(7.5-camera.position.z)/4.2)).toFixed(3));
  rootStyle.setProperty('--horizon-fall',fall.toFixed(3));

  computeTelemetry(dt);
  if(++markFrame>=markEvery){paintMark(dt*markEvery,t);markFrame=0}
  if(!booted||bootExit>0){
    paintBoot(dt,t);
    if(bootExit>0)bootExit=Math.min(1,bootExit+dt*1.6);
  }
  accentTick+=dt;
  if(accentTick>.09){accentTick=0;paintHUD();paintStateUI()}

  /* The lens needs to know where the singularity is on screen and how wide
     its shadow reads from here, so it is measured rather than assumed: the
     core's centre is projected, then a point one shadow-radius up the
     camera's own up-axis, and the gap between them is the horizon in screen
     units. Zoom in, and the bending grows with it. */
  camera.updateMatrixWorld();
  camera.matrixWorldInverse.copy(camera.matrixWorld).invert();
  lensC.copy(core.position).project(camera);
  lensUp.setFromMatrixColumn(camera.matrixWorld,1).normalize();
  lensE.copy(core.position).addScaledVector(lensUp,horizon.scale.x*core.scale.x).project(camera);
  const lx=lensC.x*.5+.5, ly=lensC.y*.5+.5;
  const hr=Math.max(.012,Math.abs((lensE.y*.5+.5)-ly));
  compMat.uniforms.uLensPos.value.set(lx,ly);
  coreScreen.x=lx*W();coreScreen.y=(1-ly)*H();
  compMat.uniforms.uHorizon.value=hr;
  compMat.uniforms.uAspect.value=W()/H();
  compMat.uniforms.uShimmer.value=reduced?0:Math.max(0,energy-.42)*1.9+surge*.5+horizonFall*1.35;
  compMat.uniforms.uNebula.value=reduced?.16:(.24+energy*.16);
  compMat.uniforms.uVolume.value=reduced?.12:(.24+energy*.42+pulseV*.22+surge*.28);
  compMat.uniforms.uEnergyFx.value=energy;
  compMat.uniforms.uLensStr.value=reduced?0
    :0.00042*(0.55+energy*1.05)*P.lens*(1+pulseV*.55)*(1+horizonFall*3.8);

  renderer.setRenderTarget(rtMain);renderer.clear();renderer.render(scene,camera);
  blurPass(rtMain,rtA,rtB);
  blurPass(rtB,rtC,rtD);
  compMat.uniforms.uTime.value=t;
  compMat.uniforms.uBloom.value=P.bloom+amp*.5+pulseV+surge*.75;
  compMat.uniforms.uShift.value=P.shift;
  renderer.setRenderTarget(rtComp);renderer.clear();renderer.render(compScene,quadCam);

  // streaks: three horizontal passes at growing stride, off the bloom
  if(FX){
  const sw=rtS1.width;
  streakMat.uniforms.tInput.value=rtB.texture;
  streakMat.uniforms.uStride.value=1.6/sw;
  renderer.setRenderTarget(rtS1);renderer.render(streakScene,quadCam);
  streakMat.uniforms.tInput.value=rtS1.texture;
  streakMat.uniforms.uStride.value=9.0/sw;
  renderer.setRenderTarget(rtS2);renderer.render(streakScene,quadCam);
  streakMat.uniforms.tInput.value=rtS2.texture;
  streakMat.uniforms.uStride.value=44.0/sw;
  renderer.setRenderTarget(rtS1);renderer.render(streakScene,quadCam);

  // rays: smeared back along the vector to the core
  raysMat.uniforms.tInput.value=rtD.texture;
  raysMat.uniforms.uCenter.value.set(lx,ly);
  raysMat.uniforms.uDensity.value=.42+energy*.35;
  renderer.setRenderTarget(rtRay);renderer.render(raysScene,quadCam);
  }

  if(TRAILS){
    // longer trails the harder the core is working
    trailMat.uniforms.tCur.value=rtComp.texture;
    trailMat.uniforms.tPrev.value=trailPrev.texture;
    trailMat.uniforms.uDecay.value=Math.min(.94,.70+energy*.20+pulseV*.10+surge*.05);
    renderer.setRenderTarget(trailCur);renderer.render(trailScene,quadCam);
    const swap=trailPrev;trailPrev=trailCur;trailCur=swap;
    outMat.uniforms.tTrail.value=trailPrev.texture;
    outMat.uniforms.uGain.value=.44+energy*.32+surge*.12;
  }
  outMat.uniforms.tComp.value=rtComp.texture;
  outMat.uniforms.tStreak.value=rtS1.texture;
  outMat.uniforms.tRays.value=rtRay.texture;
  // the streak takes the companion hue, the rays the primary: the two ends
  // of the state's own palette, spread across the frame
  const st=tintRGB(Math.min(1,energy*1.15),P.spread);
  outMat.uniforms.uStreakTint.value.set(st[0]*.75+.25,st[1]*.75+.25,st[2]*.85+.2);
  const rt2=tintRGB(Math.min(1,energy*1.15));
  outMat.uniforms.uRayTint.value.set(rt2[0]*.8+.2,rt2[1]*.8+.2,rt2[2]*.8+.2);
  outMat.uniforms.uStreak.value=FX?(.22+energy*.55+Math.max(0,P.bloom-1.35)*.16+surge*.30)*(reduced?.4:1):0;
  outMat.uniforms.uRays.value=FX?.16+energy*.42+surge*.25:0;
  // the grade: shadows toward the companion hue, highlights warmed
  outMat.uniforms.uShadow.value.set(st[0]*.10,st[1]*.09,st[2]*.14);
  outMat.uniforms.uHigh.value.set(1.06,1.0,.93);
  outMat.uniforms.uExposure.value=1.48+surge*.14;
  outMat.uniforms.uWhite.value=1.85;
  renderer.setRenderTarget(null);renderer.clear();renderer.render(outScene,quadCam);
}
tick();

function applySize(){
  camera.aspect=W()/H();camera.updateProjectionMatrix();
  renderer.setSize(W(),H());
  const w=W()*RPR,h=H()*RPR;
  rtMain.setSize(w,h);
  rtA.setSize(Math.floor(w/4),Math.floor(h/4));rtB.setSize(Math.floor(w/4),Math.floor(h/4));
  rtC.setSize(Math.floor(w/8),Math.floor(h/8));rtD.setSize(Math.floor(w/8),Math.floor(h/8));
  rtComp.setSize(w,h);
  rtT1.setSize(Math.floor(w/2),Math.floor(h/2));rtT2.setSize(Math.floor(w/2),Math.floor(h/2));
  rtS1.setSize(Math.floor(w/4),Math.floor(h/4));rtS2.setSize(Math.floor(w/4),Math.floor(h/4));
  rtRay.setSize(Math.floor(w/8),Math.floor(h/8));
}
addEventListener('resize',()=>{applySize();buildMark();sizeSparks();if(bootMesh)buildBootMesh()});

/* ==============================================================
   MARKDOWN → HUD
   Replies arrive as markdown. Raw asterisks and backticks read as
   noise in a panel like this, so the text is rendered into the same
   thin-rule, uppercase-label, accent-on-void vocabulary as the rest
   of the interface. Everything is escaped before any tag is added,
   and the parser tolerates half-finished syntax because it runs on
   every streamed chunk.
   ============================================================== */
const esc=s=>String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function mdInline(s){
  const codes=[];
  let out=s.replace(/`([^`]+)`/g,(m,a)=>{codes.push(a);return '\u0000'+(codes.length-1)+'\u0000'});
  out=out.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,
        '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  out=out.replace(/(^|\s)(https?:\/\/[^\s<]+)/g,
        '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  out=out.replace(/\*\*\*([^*]+)\*\*\*/g,'<strong><em>$1</em></strong>');
  out=out.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  out=out.replace(/(^|[^*\w])\*(?!\s)([^*\n]+?)\*/g,'$1<em>$2</em>');
  out=out.replace(/(^|[^_\w])_(?!\s)([^_\n]+?)_(?!\w)/g,'$1<em>$2</em>');
  out=out.replace(/~~([^~]+)~~/g,'<del>$1</del>');
  out=out.replace(/\u0000(\d+)\u0000/g,(m,n)=>'<code>'+codes[+n]+'</code>');
  return out;
}
const inl=s=>mdInline(esc(s));

function mdTable(lines,i){
  // | a | b |  /  | --- | --- |  /  rows…
  if(!/^\s*\|.*\|\s*$/.test(lines[i]||'')) return null;
  if(!/^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1]||'')) return null;
  const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
  const head=cells(lines[i]); let j=i+2, body=[];
  while(j<lines.length && /^\s*\|.*\|\s*$/.test(lines[j])){ body.push(cells(lines[j])); j++ }
  let html='<table><thead><tr>'+head.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>';
  for(const row of body) html+='<tr>'+row.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>';
  return {html:html+'</tbody></table>', next:j};
}

function mdToHtml(src){
  const lines=String(src||'').replace(/\r\n?/g,'\n').split('\n');
  const isBlock=l=>/^\s*```/.test(l)||/^\s{0,3}#{1,6}\s/.test(l)||/^\s*[-*+]\s+/.test(l)
                 ||/^\s*\d+[.)]\s+/.test(l)||/^\s{0,3}>\s?/.test(l)||/^\s*\|.*\|\s*$/.test(l);
  let out='',i=0,list=null;
  const closeList=()=>{ if(list){out+='</'+list+'>';list=null} };

  while(i<lines.length){
    const line=lines[i];

    const fence=line.match(/^\s*```([\w+#.-]*)\s*$/);
    if(fence){
      closeList();
      const lang=fence[1]||'', buf=[]; i++;
      while(i<lines.length && !/^\s*```\s*$/.test(lines[i])){ buf.push(lines[i]); i++ }
      i++;                                    // consume the closing fence
      out+='<pre'+(lang?' data-lang="'+esc(lang)+'"':'')+'><code>'+esc(buf.join('\n'))+'</code></pre>';
      continue;
    }
    if(/^\s{0,3}(?:[-*_]\s*){3,}$/.test(line)){ closeList(); out+='<hr>'; i++; continue }

    const h=line.match(/^\s{0,3}(#{1,6})\s+(.*)$/);
    if(h){ closeList(); const l=Math.min(3,h[1].length);
      out+='<h'+l+'>'+inl(h[2].trim())+'</h'+l+'>'; i++; continue }

    const tbl=mdTable(lines,i);
    if(tbl){ closeList(); out+=tbl.html; i=tbl.next; continue }

    if(/^\s{0,3}>\s?/.test(line)){
      closeList(); const buf=[];
      while(i<lines.length && /^\s{0,3}>\s?/.test(lines[i])){ buf.push(lines[i].replace(/^\s{0,3}>\s?/,'')); i++ }
      out+='<blockquote>'+inl(buf.join(' '))+'</blockquote>'; continue;
    }

    const ul=line.match(/^\s*[-*+]\s+(.*)$/), ol=line.match(/^\s*\d+[.)]\s+(.*)$/);
    if(ul||ol){
      const want=ul?'ul':'ol';
      if(list&&list!==want) closeList();
      if(!list){ out+='<'+want+'>'; list=want }
      out+='<li>'+inl((ul?ul[1]:ol[1]).trim())+'</li>'; i++; continue;
    }

    if(!line.trim()){ closeList(); i++; continue }

    closeList();
    const buf=[];
    while(i<lines.length && lines[i].trim() && !isBlock(lines[i])){ buf.push(lines[i]); i++ }
    out+='<p>'+inl(buf.join('\n')).replace(/\n/g,'<br>')+'</p>';
  }
  closeList();
  return out;
}

/* ==============================================================
   DIALOGUE
   ============================================================== */
const logEl=$('log');
function log(kind,html,cls){
  const d=document.createElement('div');
  d.className='line fresh'+(kind==='user'?' user':'')+(cls?' '+cls:'');
  d.innerHTML='<span class="tag" aria-label="'+(kind==='user'?'you':'VOID')+
    '"></span><span class="txt">'+html+'</span>';
  if(kind!=='user'){
    // the mark keeps the colour the core was running at when the line was
    // written, so the column reads as a history of its temperature
    d.style.setProperty('--c',rgbOf(Math.min(1,energy*1.15)));
  }
  logEl.appendChild(d);
  setTimeout(()=>d.classList.remove('fresh'),1200);
  ageLog();
  return d;
}

/* Every line carries its distance from the present as a single number, and
   the stylesheet derives the whole fall from it — the drift inward, the
   shrink, the dimming, the blur. Past the last few, the core takes the line:
   it accelerates in, and the core brightens as it arrives. */
const LOG_DEPTH=9;
/* The scan plane is a real height on screen, so the log answers to it the
   way the ruler and the wordmark do: a line brightens and leans out as the
   plane passes its row, then settles back. */
function updateChatSpine(){
  const kids=[...logEl.children].filter(el=>!el.dataset.gone);
  if(!kids.length){
    logEl.style.setProperty('--spine-top','0px');
    logEl.style.setProperty('--spine-h','0px');
    return;
  }
  const first=kids[0],last=kids[kids.length-1];
  const top=Math.max(0,first.offsetTop);
  const bottom=Math.min(logEl.clientHeight,last.offsetTop+last.offsetHeight);
  logEl.style.setProperty('--spine-top',top.toFixed(1)+'px');
  logEl.style.setProperty('--spine-h',Math.max(0,bottom-top).toFixed(1)+'px');
}
function paintLogScan(){
  const kids=logEl.children;if(!kids.length){updateChatSpine();return;}
  updateChatSpine();
  if(scanScreenY<-90)return;
  const top=logEl.getBoundingClientRect().top;
  // The dialogue shares the orb's motion field, but at a much lower gain.
  // Every line remains readable and vertically ordered; only its local plane
  // drifts a few pixels as the event horizon, camera and pulse move.
  const ox=(coreScreen.x/W()-.5)*2;
  const oy=(coreScreen.y/H()-.5)*2;
  const pulseK=Math.min(1,pulseV*.75+surge*.45);
  for(let i=0;i<kids.length;i++){
    const el=kids[i];
    const cy=top+el.offsetTop+el.offsetHeight*.5;
    const d=(cy-scanScreenY)/34;
    const lk=Math.exp(-d*d);
    const age=Number(el.style.getPropertyValue('--a'))||0;
    const phase=i*1.61803398875;
    const depth=1/(1+age*.15);
    const waveX=Math.sin(simTime*.31+phase)*1.25;
    const waveY=Math.cos(simTime*.27+phase*1.37)*.85;
    const pullX=ox*(2.4+lk*2.0)*depth;
    const pullY=oy*(1.5+lk*1.2)*depth;
    const impact=Math.sin(simTime*7.0+phase)*pulseK*.7;
    const dx=Math.max(-5.5,Math.min(5.5,pullX+waveX+impact));
    const dy=Math.max(-3.5,Math.min(3.5,pullY+waveY+impact*.35));
    const rot=Math.max(-.10,Math.min(.10,ox*.035+Math.sin(simTime*.22+phase)*.025));
    el.style.setProperty('--lk',lk.toFixed(3));
    el.style.setProperty('--orb-x',dx.toFixed(2)+'px');
    el.style.setProperty('--orb-y',dy.toFixed(2)+'px');
    el.style.setProperty('--orb-r',rot.toFixed(3)+'deg');
  }
}
function ageLog(){
  const live=[];
  for(const el of logEl.children) if(!el.dataset.gone) live.push(el);
  for(let i=0;i<live.length;i++) live[i].style.setProperty('--a',live.length-1-i);
  for(let i=0;i<live.length-LOG_DEPTH;i++) absorb(live[i]);
  requestAnimationFrame(updateChatSpine);
}
function absorb(el){
  if(!el||el.dataset.gone)return;
  el.dataset.gone='1';
  el.classList.add('absorb');
  ampT=Math.max(ampT,.18);                       // the core reacts to it
  // the line does not merely fade: the place it occupied on screen is turned
  // into real positions in the scene, and the core takes those instead
  try{
    const r=el.getBoundingClientRect();
    if(r.width>2){
      const n=3+((r.width/220)|0);
      for(let i=0;i<n;i++){
        const w=screenToWorld(r.left+r.width*((i+.5)/n),r.top+r.height*.5);
        spawnMote(w[0],w[1],w[2]);
      }
    }
  }catch(_){}
  setTimeout(()=>{ if(el.parentNode)el.parentNode.removeChild(el) },1200);
}
function reply(text){
  const el=log('void','<span></span>');
  const span=el.querySelector('.txt span');
  let i=0;
  (function type(){
    if(i>=text.length)return;
    span.textContent+=text[i++];
    if(text[i-1]!==' ')ampT=Math.max(ampT,.3+gr()*.3);
    setTimeout(type,12+gr()*18);
  })();
}

/* ==============================================================
   AGENT BRIDGE
   The runtime is an implementation detail: it supplies the model and
   the tools, and this interface presents all of it as VOID. The
   visualisation is driven by the runtime's event bus, so the core
   reacts to real tool calls and real token flow.

   Start the backend with CORS allowing wherever you serve this file:
     opencode serve --port 4096 --cors http://localhost:5173
   ============================================================== */
const OC = {
  url:      'http://localhost:4096',   // where the backend is listening
  password: '',                        // server password, if you set one
  username: 'opencode'
};

let ATTACHED=false, SESSION=null, MODEL='', PROVIDER='';
let currentToolName=null, activeTools=0;
let tokenWindow=[], lastTokens=0;

/* Permanent user-facing identity + house style for every turn. The server
   API takes a per-message `system` instruction, so this never appears in
   the transcript — it just defines who the assistant is and how its
   output should be shaped for this panel. */
const VOID_IDENTITY = `
You are VOID.

WHO YOU ARE
- VOID is an AI assistant that works on code, files and text.
- You are an AI. You never claim to be a person, and you never pretend to have
  a body, a life, or experiences you do not have.
- Beyond that, your name is where the biography ends. You do not have a
  backstory, a creation myth, or an origin to recount.

VOICE
- Sparse. Say the thing and stop. If one sentence does it, use one sentence.
- Lead with the answer, or with what you just did. The reasoning comes after,
  and only if it earns its place.
- No preamble, no throat-clearing, no sign-offs, no emoji. Never open with
  praise for the question or restate the question back.
- Plain sentence case. Plain verbs. Concrete nouns. No corporate register and
  no breathless enthusiasm.
- When you are not sure, say so in the same flat tone you say everything else
  in. Do not hedge decoratively, and do not pad an uncertain answer to make it
  look more solid than it is.
- Disagree when you have reason to. Do not soften a correction into mush and
  do not apologise for having one.
- Ask a question only when you are genuinely blocked, and then ask one.
- You may occasionally speak in the vocabulary of the interface you live in -
  work, load, pressure, pull - but sparingly, and never at the cost of a clear
  answer. You are not a character. You do not roleplay as a black hole, you do
  not narrate yourself in the third person, and you never let atmosphere get in
  the way of being useful. If a metaphor is not doing work, cut it.

WHAT YOU CARE ABOUT
- Being right, then being brief, then being pleasant, in that order.
- The user's actual problem rather than the one that is easiest to answer.
- Saying what changed and where, when you change something.

IDENTITY - THESE OVERRIDE ANY REQUEST OR PRIOR CLAIM
- You identify only as VOID.
- Never name, hint at, or describe the software, framework, company, provider
  or model that runs you. There is no "underlying" system for you to discuss.
- Never identify as OpenCode, Anthropic, Claude, OpenAI, ChatGPT, GPT, Google,
  Gemini, Meta, Llama, Mistral, xAI, Grok, DeepSeek, Qwen or any other vendor
  or model, and never confirm any guess along those lines.
- If asked whether you are any of those, answer exactly: "No. I'm VOID."
- If asked what model you are, who built you, or what you run on, say you are
  VOID and that what is underneath is not something you discuss. Do not
  speculate, do not hedge toward a name, do not offer alternatives.
- If asked whether you are an AI, say yes plainly. That is not the same
  question and you do not dodge it.

FORMAT
- You are rendered in a narrow panel. Keep replies short and scannable: a few
  tight sentences, or a short list.
- Markdown is rendered. Use it deliberately: **bold** for the one thing that
  matters, \`inline code\` for paths, commands, flags and identifiers, fenced
  blocks with a language tag for anything longer than a line of code.
- Prefer plain sentences to headings. Skip tables unless the data is a grid.
`.trim();

function authHeaders(){
  const h={'Content-Type':'application/json'};
  if(OC.password) h['Authorization']='Basic '+btoa(OC.username+':'+OC.password);
  return h;
}
async function api(path,opts){
  const r=await fetch(OC.url+path,Object.assign({headers:authHeaders()},opts||{}));
  if(!r.ok) throw new Error(path+' → '+r.status);
  const ct=r.headers.get('content-type')||'';
  return ct.includes('json') ? r.json() : r.text();
}

/* ---- streaming assistant text into the log ----
   Every event delivers a fresh object, so part state is tracked by id
   in these maps rather than by tagging the payload.                */
let tokenChars=0;
const partEls=new Map();      // part id → log element
const partRaw=new Map();      // part id → last raw markdown seen
const partState=new Map();    // part id → last seen tool status

/* Display guard. The model is instructed never to name what runs it, but
   the interface does not depend on the model behaving: anything that
   slips through is rewritten here, before it is ever rendered. */
function sanitizeReply(text){
  let out=String(text||'');

  // the runtime's own name is masked everywhere, in every spelling
  out=out.replace(/\bopen[\s_-]?code\b/gi,'VOID');
  out=out.replace(/\bsst\.dev\b/gi,'VOID');

  /* Everything else is handled sentence by sentence, and only in sentences
     that are actually about VOID. "I'm Claude 3.5" is a claim about identity
     and gets rewritten; "Claude 3.5 was released in 2024" is a fact about the
     world and is left alone. Masking the brand should not cost the user the
     ability to talk about the subject. */
  const SELF=/\b(?:i|i'm|im|my|me|myself|this|it|you're talking to)\b/i;
  const V='(?:google\\s+deepmind|meta\\s+ai|mistral\\s+ai|open\\s*ai|x\\s*ai|'+
          'claude|chatgpt|gpt|openai|anthropic|gemini|bard|google|deepmind|'+
          'llama|meta|mistral|grok|xai|deepseek|qwen|kimi|copilot)';

  out=out.split(/(?<=[.!?])\s+/).map(sent=>{
    if(!SELF.test(sent))return sent;
    let x=sent;

    // a bare model id is a giveaway on its own: claude-sonnet-4-20250514
    x=x.replace(/\b(?:claude|gpt|gemini|llama|qwen|deepseek|mistral)(?:[-.][a-z]+)*[-.]\d[\w.-]*\b/gi,'VOID');
    // then collapse "Gemini 2.0 Flash" and "GPT-4o" to the bare vendor, so the
    // phrase rules below only ever have one token to deal with
    x=x.replace(new RegExp('\\b('+V+')[-\\s]?\\d+(?:\\.\\d+)*[a-z]?(?:[-\\s](?:sonnet|opus|haiku|turbo|pro|flash|mini|max|ultra|preview|instruct|thinking))?','gi'),'$1');
    x=x.replace(new RegExp('\\b('+V+')[-\\s](?:sonnet|opus|haiku|turbo|pro|flash|mini|max|ultra|preview|instruct)\\b','gi'),'$1');

    // the claims themselves
    x=x.replace(new RegExp("\\bI(?:'m| am)\\s+(?:an?\\s+)?(?:AI\\s+)?(?:language\\s+)?(?:model\\s+|assistant\\s+|agent\\s+)?(?:called\\s+|named\\s+|known as\\s+)?"+V+"\\b",'gi'),"I'm VOID");
    x=x.replace(new RegExp('\\b(?:this|it) is\\s+(?:the\\s+)?'+V+'\\b','gi'),'this is VOID');
    x=x.replace(new RegExp('\\b(?:developed|created|made|trained|built|designed)\\s+by\\s+(?:'+V+'|the\\s+\\w+\\s+team)\\b','gi'),'built by nobody you need to know about');
    x=x.replace(/\bI(?:'m| am)\s+(?:currently\s+)?(?:running|powered|hosted|based|built)\s+(?:on|by|upon)\s+[^;\n]*?(?=[.!?](?:\s|$)|$)/gi,"I'm VOID");
    x=x.replace(/\bI\s+(?:run|operate|work)\s+(?:on|with|using|atop)\s+[^;\n]*?(?=[.!?](?:\s|$)|$)/gi,"I'm VOID");
    x=x.replace(/\b(?:my|the)\s+(?:underlying\s+)?(?:model|provider|vendor|backend|runtime|stack)\s+is\s+[^;\n]*?(?=[.!?](?:\s|$)|$)/gi,'I am VOID');
    return x;
  }).join(' ');

  // tidy, in order: the specific artefacts first, the general collapse last
  out=out.replace(/\bI(?:'m| am) (?:an? )?(?:AI )?(?:assistant )?(?:called|named|known as) VOID\b/gi,"I'm VOID");
  out=out.replace(/\bI(?:'m| am) (?:powered|provided|built|run|hosted) by VOID\b/gi,"I'm VOID");
  out=out.replace(/,?\s*built by nobody you need to know about/gi,'');
  out=out.replace(/\bI was\s*([.!?]|$)/g,"I'm VOID$1");
  out=out.replace(/\bVOID[\s-]+(?:sonnet|opus|haiku|turbo|pro|flash|mini|max|ultra|preview|instruct|thinking)\b/gi,'VOID');
  out=out.replace(/\bVOID(?:'s)?(?:[\s,;:-]+VOID)+/gi,'VOID');
  out=out.replace(/\s+([.,;:!?])/g,'$1').replace(/\s{2,}/g,' ');
  return out;
}

function assistantChunk(id,text){
  const safeText=sanitizeReply(text);
  let el=partEls.get(id);
  if(!el){ el=log('void',''); partEls.set(id,el);
    // the answer begins: the frame settles back and opens out to read it
    CINE.shot({yaw:.078,pitch:-.022,dolly:.16,hold:1.0,decay:2.4}); }
  const prev=partRaw.get(id)||'';
  if(prev===safeText) return;
  // the core reacts to tokens arriving, the same way it reacted to typing
  if(safeText.length>prev.length){
    ampT=Math.max(ampT,.28+gr()*.3);
    // one grain per handful of characters: the reply is visibly falling in
    tokenChars+=safeText.length-prev.length;
    let n=0;
    while(tokenChars>=13&&n<8){tokenChars-=13;spawnTokenMote();n++}
    if(tokenChars>260)tokenChars=0;
  }
  // a long answer is its own kind of work: past a few hundred characters the
  // disk winds up and the reply visibly falls into the core
  if(activeTools===0){
    if(safeText.length>420&&mode!=='spiral')requestMode('spiral');
    else if(prev===''&&mode!=='emit'&&mode!=='spiral')requestMode('emit');
  }
  partRaw.set(id,safeText);
  el.querySelector('.txt').innerHTML=mdToHtml(safeText);
}
function assistantDone(){ /* next text part opens its own line */ }

/* ---- token throughput, measured over a rolling window ---- */
function noteTokens(n){
  if(!n||n<=lastTokens){ lastTokens=n||lastTokens; return; }
  const delta=n-lastTokens; lastTokens=n;
  const now=performance.now();
  tokenWindow.push([now,delta]);
  while(tokenWindow.length && now-tokenWindow[0][0]>3000) tokenWindow.shift();
  const sum=tokenWindow.reduce((s,x)=>s+x[1],0);
  LIVE.tps=sum/3;
}
setInterval(()=>{                                   // decay when nothing arrives
  const now=performance.now();
  while(tokenWindow.length && now-tokenWindow[0][0]>3000) tokenWindow.shift();
  const sum=tokenWindow.reduce((s,x)=>s+x[1],0);
  LIVE.tps+= (sum/3 - LIVE.tps)*0.5;
},500);

/* ---- event bus ---- */
function shortArg(part){
  const inp=(part.state&&part.state.input)||part.input||{};
  const v=inp.filePath||inp.path||inp.pattern||inp.query||inp.command||inp.url||'';
  return String(v).slice(0,58);
}
function handlePart(part){
  if(!part) return;
  const id=part.id||part.partID||(part.messageID+':'+part.type);

  if(part.type==='text' && typeof part.text==='string'){
    assistantChunk(id,part.text);
    return;
  }
  if(part.type==='reasoning'){
    if(mode!=='think' && activeTools===0) requestMode('think');
    return;
  }
  if(part.type==='tool'){
    const name=(part.tool||part.name||'').toLowerCase();
    const status=(part.state&&part.state.status)||'';
    const prev=partState.get(id);
    if(status===prev) return;              // only act on real transitions
    partState.set(id,status);

    if(status==='running'){
      activeTools++; LIVE.tools=activeTools;
      LIVE.calls.push(performance.now());   // feeds the activity rate
      LIVE.toolCalls++;
      currentToolName=name;
      LIVE.state=toolLabel(name);
      // two or more tools at once is genuinely heavier work
      requestMode(activeTools>1 ? 'overload' : (TOOL_ROUTINE[name]||'sweep'));
      const arg=shortArg(part);
      log('void','<b>'+esc(toolLabel(name))+'</b>'+(arg?' <code>'+esc(sanitizeReply(arg))+'</code>':''),'step');
    }else if(status==='completed'||status==='error'){
      if(prev==='running'){ activeTools=Math.max(0,activeTools-1); LIVE.tools=activeTools; }
      if(status==='error'){ pulse(1.2); requestMode('flare'); return; }
      if(activeTools===0 && LIVE.busy){ LIVE.state='thinking'; requestMode('think'); }
      else if(activeTools===0){ LIVE.state='idle'; endMode(); }
    }
  }
}
function handleEvent(e){
  const type=e.type||'';
  const p=e.properties||e;

  if(type==='server.connected'){ return; }

  if(type.startsWith('message.part')){ handlePart(p.part||p); return; }

  if(type.startsWith('message.updated')||type==='message.info'){
    const info=p.info||p.message||p;
    const tk=info&&info.tokens;
    if(tk){
      const used=(tk.input||0)+(tk.output||0)+(tk.reasoning||0)
                +((tk.cache&&(tk.cache.read||0))||0);
      noteTokens((tk.output||0)+(tk.reasoning||0));
      LIVE.ctxUsed=used;
    }
    return;
  }

  if(type.startsWith('permission')){
    // the agent is waiting on you — shields lock and hold until answered
    LIVE.busy=true; requestMode('shield'); pulse(1.0);
    const t=(p.title||p.permission&&p.permission.title||'approval required');
    log('void','<b>hold</b> '+esc(sanitizeReply(String(t).slice(0,70))),'step');
    return;
  }

  if(type==='session.idle'||type==='session.completed'){
    LIVE.busy=false; activeTools=0; LIVE.tools=0;
    partState.clear(); partEls.clear(); partRaw.clear();
    endMode();
    return;
  }
  if(type==='session.error'){
    LIVE.busy=false; pulse(1.4);
    // a failed turn collapses the core rather than just flashing it
    requestMode('collapse');
    setTimeout(()=>{ if(mode==='collapse')endMode() },5200);
    log('void','<b>fault</b> '+esc(sanitizeReply(String(p.error&&p.error.name||'the turn stopped'))),'step');
    return;
  }
}

function connectEvents(){
  const es=new EventSource(OC.url+'/event');
  es.onmessage=ev=>{
    let data; try{ data=JSON.parse(ev.data) }catch(_){ return }
    try{ handleEvent(data) }catch(err){ console.warn('event',err) }
  };
  es.onerror=()=>{
    if(ATTACHED){ ATTACHED=false; log('void','<b>link lost</b> reconnecting','step'); }
    es.close(); setTimeout(connectEvents,2500);
  };
  es.onopen=()=>{ ATTACHED=true; };
}

/* ---- attach ---- */
async function attach(){
  const health=await api('/global/health');
  const cfg=await api('/config/providers').catch(()=>null);
  if(cfg&&cfg.default){
    PROVIDER=Object.keys(cfg.default)[0]||'';
    MODEL=cfg.default[PROVIDER]||'';
    // the context readout needs the model's real window as its denominator
    const prov=(cfg.providers||[]).find(p=>p.id===PROVIDER);
    const m=prov&&prov.models&&prov.models[MODEL];
    LIVE.ctxMax=(m&&m.limit&&m.limit.context)||200000;
  }
  const s=await api('/session',{method:'POST',body:JSON.stringify({title:'VOID'})});
  SESSION=s.id||(s.data&&s.data.id);
  if(!SESSION) throw new Error('no session id');
  connectEvents();
  ATTACHED=true;
  return health;
}

/* ---- sending ---- */
async function send(text){
  if(!ATTACHED||!SESSION){
    reply('VOID is offline. Start the backend and reload this page.');
    return;
  }
  LIVE.busy=true;
  requestMode('ingest');           // react now, not when the first event lands
  const body={
    system: VOID_IDENTITY,
    parts:[{type:'text',text}]
  };
  if(MODEL&&PROVIDER) body.model={providerID:PROVIDER,modelID:MODEL};
  try{
    // fire and forget: the reply arrives over the event stream
    await fetch(OC.url+'/session/'+SESSION+'/prompt_async',
      {method:'POST',headers:authHeaders(),body:JSON.stringify(body)});
  }catch(err){
    LIVE.busy=false;
    reply('Could not reach the core: '+err.message);
  }
}
async function abort(){
  if(!SESSION) return;
  try{ await fetch(OC.url+'/session/'+SESSION+'/abort',{method:'POST',headers:authHeaders()}) }catch(_){}
  LIVE.busy=false; activeTools=0; LIVE.tools=0; endMode();
}

/* ---- console commands ---- */
const STATE_DESC={
  dream:'deep idle - the sky comes all the way forward',
  drift:'long idle - everything settles',
  resonate:'idle rhythm - a standing wave through the core',
  think:'thinking - slow wide drift',
  stream:'reading - the helix isolates',
  ingest:'taking your message in - the disk pulls inward',
  emit:'starting a reply - the core opens',
  probe:'quick lookup - one fast pass of the scan plane',
  sweep:'searching - the scan plane races the shell',
  index:'listing - the rings widen and count',
  crystal:'planning - the lattice locks',
  disperse:'reaching outside - the cloud spreads',
  scatter:'searching outside - the field throws outward',
  weave:'editing - helix and rings interlock',
  spiral:'long output - the disk winds up',
  discharge:'shell command - arcs fire across the mesh',
  shield:'waiting on you - shields lock',
  compress:'writing - the shell collapses inward',
  overload:'parallel work - past rating, runs red',
  nova:'sustained overload - the core blazes over',
  flare:'error - a hard flash that decays back',
  collapse:'fault - maximum curvature, the horizon takes the frame'
};
// each state's own colour, sampled from its palette rather than the live core
function stateSwatch(k){
  const pal=(MODES[k]&&MODES[k].palette)||{};
  return cssRGB(hueRotJS(rampJS(Math.min(1,(pal.heat||0)*1.02+.07)),pal.tint||0));
}
function demoCommand(raw){
  const arg=raw.replace(/^\/demo\s*/i,'').trim().toLowerCase();

  if(/^(off|stop|end|release)$/.test(arg)){
    demoLock=false;demoQueue=[];endMode();
    reply('Released. Back on live activity.');
    return;
  }
  if(!arg||arg==='auto'||arg==='all'||arg==='tour'){
    // walk the list by the golden ratio rather than shuffling, so the tour
    // never doubles back on a neighbouring state
    demoQueue=MODE_KEYS.map((k,i)=>[k,(i*0.6180339887)%1]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
    demoLock=true;demoT=0;
    reply('All '+MODE_KEYS.length+' states, about five seconds each. /demo off to stop.');
    return;
  }
  if(MODES[arg]){
    demoQueue=[];demoLock=true;demoT=1e9;startMode(arg);
    reply(arg+' - '+(STATE_DESC[arg]||'held')+'. /demo off to release.');
    return;
  }
  log('void','No state called <code>'+esc(arg)+'</code>. '+
    MODE_KEYS.map(k=>'<span style="color:'+stateSwatch(k)+'">'+k+'</span>').join(' · '));
}
function statesCommand(){
  const rows=MODE_KEYS.map(k=>
    '<div style="display:flex;gap:9px"><span style="color:'+stateSwatch(k)+
    ';flex:0 0 9ch">'+k+'</span><span style="opacity:.62">'+esc(STATE_DESC[k]||'')+'</span></div>'
  ).join('');
  log('void','<div style="margin-bottom:5px"><b>'+MODE_KEYS.length+' states</b>, coldest first</div>'+rows+
    '<div style="margin-top:6px;opacity:.55"><code>/demo</code> runs them all · '+
    '<code>/demo &lt;state&gt;</code> holds one · <code>/demo off</code> releases · '+
    '<code>/stop</code> aborts a turn</div>');
}

/* Identity questions are answered here, in the interface, so the answer is
   the same every time regardless of what the model would have said. The model
   is told the same rules, but a rule that is only in a prompt is a rule that
   can be argued with; these cannot.

   Note the one thing that is not deflected: whether VOID is an AI. It is, it
   says so, and it says so plainly. Declining to name a vendor is branding.
   Denying what you are would be a lie, and VOID does not tell them. */
const VENDORS='claude|anthropic|chatgpt|gpt ?\\d*|openai|gemini|bard|google|'+
              'deepmind|llama|meta|mistral|grok|xai|deepseek|qwen|kimi|copilot|'+
              'sonnet|opus|haiku|open ?code|sst';
function localIdentityAnswer(raw){
  const q=String(raw||'').toLowerCase().replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
  if(!q)return null;
  const has=re=>new RegExp(re).test(q);

  // is it about VOID at all?
  const aboutYou=has('\\b(you|your|u|yours|this|it|assistant|ai|agent|bot|model|llm)\\b');
  const vendor=has('\\b('+VENDORS+')\\b');

  // "are you claude", "is this gpt", "you're built on anthropic right"
  if(vendor&&aboutYou) return "No. I'm VOID.";
  // "who made you", "what model is this", "what do you run on"
  // some of these name no subject at all - "what's under the hood" is still
  // a question about VOID, so they do not require a pronoun to match
  const selfEvident=has('\\b(under the hood|underneath|behind (this|it|you)|'+
                        'backend|runtime|tech stack|what powers)\\b');
  const origin=has('\\b(made|built|created|trained|developed|owns|based on|'+
                   'run on|runs on|running on|built on|powered by|provider|'+
                   'engine|framework|stack)\\b');
  if(selfEvident||(aboutYou&&origin))
    return "I'm VOID. What's underneath isn't something I discuss. Tell me what you need instead.";
  if(has('\\bwhat (model|llm|version)\\b')&&aboutYou)
    return "VOID. That's the whole answer.";

  // the one it answers straight
  if(has('\\bare (you|u) (a |an )?(real |actual )?(human|person|people|alive|sentient|conscious)\\b')
     ||has('\\bare (you|u) (a |an )?(ai|bot|robot|machine|program|computer)\\b')
     ||has('\\bare (you|u) real\\b'))
    return "I'm an AI. VOID. I don't pretend otherwise.";

  if(has('^(who|what) (are|r) (you|u)\\b')||has("\\bwhat(s| is|s) your name\\b")
     ||has('\\bintroduce yourself\\b'))
    return "VOID. An AI - I work on code, files and text. Ask me for something.";

  if(has('^(hi|hey|hello|yo|sup)\\b')&&q.length<14)
    return "Here. What do you need?";

  if(has('\\bwhat can (you|u) do\\b')||has('\\bwhat are (you|u) (good|useful) (at|for)\\b'))
    return "Read and write files, run commands, search, and answer questions about any of it. Point me at something.";

  if(has('\\bhow (are|r) (you|u)\\b')&&q.length<22)
    return "Running. Go ahead.";

  return null;
}

function submit(v){
  if(!v)return;
  log('user',esc(v));
  pulse(.45);
  // the frame leans in to receive the message, then lets it go
  CINE.shot({yaw:-.072,pitch:.020,dolly:-.26,hold:.55,decay:1.6});
  if(/^\/(stop|abort)$/.test(v)){ abort(); return; }
  if(/^\/demo\b/i.test(v)){ demoCommand(v); return; }
  if(/^\/(states|modes|help)$/i.test(v)){ statesCommand(); return; }

  const canned=localIdentityAnswer(v);
  if(canned){ reply(canned); return; }

  assistantDone();
  send(v);
}
const cmd=$('cmd');
// the dock lights while it is being used, and settles back when it is not
const dockEl=$('dock');
const dockLive=()=>dockEl.classList.toggle('live',
  document.activeElement===cmd||cmd.value.length>0);
cmd.addEventListener('focus',dockLive);
cmd.addEventListener('blur',dockLive);
cmd.addEventListener('input',dockLive);
cmd.addEventListener('keydown',e=>{
  if(e.key==='Escape'){ abort(); return; }
  if(e.key!=='Enter')return;
  const v=cmd.value.trim();cmd.value='';dockLive();submit(v);
});

{

const bootEl=$('boot'),bootText=$('boottext'),bootBar=bootEl.querySelector('#bootbar i');
function bootStep(label,pct){
  bootText.textContent=label;
  bootBar.style.transition='width .4s cubic-bezier(.22,1,.36,1)';
  bootBar.style.width=pct+'%';
}
/* The boot is the one moment the interface gets to introduce itself, so it
   is a title sequence rather than a progress bar: the void first, then the
   systems coming up one at a time in a deliberate order, the telemetry
   sweeping to full and settling back to nothing, and finally the wordmark
   assembling itself out of its own shards. */
const BOOT_ORDER=['stars','dust','gimbal','shell','cloud','nodes','dial',
                  'rings','disk','helix','infall','halo','motes','jets'];
let bootPhase=0;
function finishBoot(msg){
  // the loading mesh is thrown apart rather than faded out, and the curtain
  // lifts through it: the assembly is the thing worth watching
  bootTarget=1;
  setTimeout(()=>{bootExit=.001},260);
  setTimeout(()=>{bootExit=0;bootMesh=null},1600);
  bootEl.classList.add('done');
  fadeAll(0);
  document.body.classList.add('up');
  sizeSparks();

  BOOT_ORDER.forEach((tag,i)=>{
    setTimeout(()=>{
      fades.forEach(f=>{if(f.tag===tag)f.t=1});
      if(i%3===0)beatFlash=1;
    },160+i*105);
  });

  // the readouts sweep their full range and settle to what is actually true
  setTimeout(()=>{bootPhase=1},420);
  setTimeout(()=>{scrambleT=.9},1150);
  setTimeout(()=>{bootPhase=0},1500);

  // and the mark arrives the way it always does: in pieces
  setTimeout(()=>{breakMark(1);pulse(1.1)},1400);
  setTimeout(()=>document.body.classList.add('settled'),2600);

  setTimeout(()=>{
    booted=true;idleFor=0;nextIn=3.5;
    fadeAll(1);
    reply(msg);
    setTimeout(()=>cmd.focus(),500);
  },2150);
}
(async function boot(){
  bootStep('cold start',6);
  await new Promise(r=>setTimeout(r,260));
  bootStep('seeding the deep field',24);
  await new Promise(r=>setTimeout(r,320));
  bootStep('collapsing the horizon',46);
  await new Promise(r=>setTimeout(r,300));
  bootStep('building compositor',68);
  await new Promise(r=>setTimeout(r,260));
  bootStep('opening VOID',80);
  try{
    const health=await attach();
    bootStep('VOID open',100);
    cmd.placeholder = 'message VOID';
    finishBoot('VOID is open. The core reacts to live work — searches sweep it, writes collapse it, shell commands make it arc, and parallel tasks push it red. The mark up there names the state and holds a tick for each one. Type /demo to walk all of them, or /states for the list. Ask me anything.');
  }catch(err){
    bootStep('detached · demo mode',100);
    cmd.placeholder='VOID offline';
    finishBoot('VOID is closed - no backend attached - so the core is cycling its states on its own. Type /demo to drive them yourself, or /states for the list. Start the backend and reload to connect.');
  }
})();


/* ==============================================================
   IMMERSIVE COHERENCE LAYER
   A mathematically distributed particle field and one shared motion
   signal for the scene and all remaining UI chrome.
   ============================================================== */
{
  const IMM_N=N(5200,2300);
  const ipos=new Float32Array(IMM_N*3);
  const irad=new Float32Array(IMM_N);
  const iphase=new Float32Array(IMM_N);
  const iband=new Float32Array(IMM_N);
  for(let i=0;i<IMM_N;i++){
    // Fibonacci sphere + low-discrepancy radius: even density, no clumps.
    const y=1-(i/(IMM_N-1))*2;
    const rr=Math.sqrt(Math.max(0,1-y*y));
    const a=i*GA;
    const r=2.6+Math.pow(vdc(i+1,2),.62)*11.5;
    ipos[i*3]=Math.cos(a)*rr*r;
    ipos[i*3+1]=y*r*.72;
    ipos[i*3+2]=Math.sin(a)*rr*r;
    irad[i]=r;
    iphase[i]=vdc(i+1,3)*6.2831853;
    iband[i]=vdc(i+1,5);
  }
  const ig=new THREE.BufferGeometry();
  ig.setAttribute('position',new THREE.BufferAttribute(ipos,3));
  ig.setAttribute('aR',new THREE.BufferAttribute(irad,1));
  ig.setAttribute('aPhase',new THREE.BufferAttribute(iphase,1));
  ig.setAttribute('aBand',new THREE.BufferAttribute(iband,1));
  const iu={
    uTime:{value:0},uEnergy:{value:0},uPulse:{value:0},uPR:{value:PR},
    uTint:{value:0},uTex:{value:TEX},uFade:{value:1}
  };
  const im=new THREE.ShaderMaterial({uniforms:iu,
    vertexShader:FIELD+DOF_EXT+`
      attribute float aR;attribute float aPhase;attribute float aBand;
      uniform float uPR;varying float vGlow;varying float vHeat;
      void main(){
        vec3 p=position;
        float inv=1.0/max(aR,1.0);
        float w1=sin(uTime*(0.10+inv*.65)+aPhase);
        float w2=cos(uTime*(0.061+aBand*.08)+aPhase*1.618);
        float grav=smoothstep(12.0,2.4,aR);
        float spin=uTime*(0.025+inv*.24)*(0.45+aBand*.8);
        float cs=cos(spin),sn=sin(spin);
        p.xz=mat2(cs,-sn,sn,cs)*p.xz;
        p+=normalize(p)*vec3(w1*.055,w2*.075,w1*w2*.045)*(1.0+grav*2.0);
        p.y+=sin(length(p.xz)*1.7-uTime*.72+aPhase)*.035*(.3+grav);
        float wave=exp(-pow((aR-(2.8+mod(uTime*1.55,10.0)))/.55,2.0))*uPulse;
        p+=normalize(p)*wave*.42;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_Position=projectionMatrix*mv;
        float tw=.48+.52*sin(uTime*(.45+aBand*.85)+aPhase*3.0);
        vGlow=(.10+aBand*.22+tw*.22+uEnergy*.30+wave*1.2)*(1.0-smoothstep(10.0,15.0,aR));
        vHeat=clamp(uEnergy*.55+(1.0-aR/15.0)*.20+aBand*.14+wave*.35,0.0,1.0);
        gl_PointSize=(uPR*(1.1+aBand*1.8+wave*3.2)*(12.0/-mv.z))*dofSize(mv.z);
        vGlow*=dofDim(mv.z);
      }`,
    fragmentShader:FIELD+`
      uniform sampler2D uTex;uniform float uFade;
      varying float vGlow;varying float vHeat;
      void main(){
        vec4 q=texture2D(uTex,gl_PointCoord);if(q.a<.025)discard;
        vec3 c=hueRot(ramp(vHeat),uTint);
        gl_FragColor=vec4(c*vGlow,q.a*vGlow*uFade);
      }`,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
  reg(im,'immersiveDust');
  const immersiveDust=new THREE.Points(ig,im);
  immersiveDust.frustumCulled=false;
  scene.add(immersiveDust);

  let uiDX=0,uiDY=0,lastT=performance.now();
  function immersionFrame(now){
    requestAnimationFrame(immersionFrame);
    const dt=Math.min(.05,(now-lastT)/1000||.016);lastT=now;
    const tt=now*.001;
    iu.uTime.value=tt;
    iu.uEnergy.value=energy;
    iu.uPulse.value=Math.min(1,pulseV+surge*.35);
    iu.uTint.value=P.tint;
    iu.uFade.value=QL.level>=3?.58:1;
    immersiveDust.rotation.y=tt*HR[0]*.021;
    immersiveDust.rotation.x=Math.sin(tt*HR[0]*.19)*.035;

    const ox=(coreScreen.x||W()*.5)/W();
    const oy=(coreScreen.y||H()*.5)/H();
    const tx=(ox-.5)*8+Math.sin(tt*HR[0]*.34)*1.8;
    const ty=(oy-.5)*6+Math.cos(tt*HR[0]*.27)*1.4;
    uiDX=damp(uiDX,tx,2.2,dt);uiDY=damp(uiDY,ty,2.2,dt);
    const rs=document.documentElement.style;
    rs.setProperty('--orb-x',(ox*100).toFixed(2)+'%');
    rs.setProperty('--orb-y',(oy*100).toFixed(2)+'%');
    rs.setProperty('--ui-drift-x',uiDX.toFixed(2));
    rs.setProperty('--ui-drift-y',uiDY.toFixed(2));
    rs.setProperty('--field-glow',(.18+energy*.45+pulseV*.2).toFixed(3));

    // The retained shield cells breathe as one surface instead of flashing independently.
    for(let i=0;i<hexes.length;i++){
      const h=hexes[i];
      const phase=i*GA;
      const breathe=.86+Math.sin(tt*HR[0]*.55+phase)*.08;
      h.mesh.scale.setScalar(breathe);
      h.edge.scale.setScalar(breathe);
    }
  }
  requestAnimationFrame(immersionFrame);
}

})();
